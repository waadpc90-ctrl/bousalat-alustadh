                            </div>

                            <div className="w-full mx-auto space-y-4">
                                <div className="flex justify-between items-start border-b-[3px] border-double border-black pb-3 text-black">
                                    <div className="text-xs font-black space-y-1 w-[32%] text-right"><p>{settings.ministryName}</p><p className="text-sm font-black">{settings.schoolName}</p></div>
                                    <div className="text-center w-[36%]"><h1 className="text-lg font-black underline">سجل درجات الطلاب السنوي الشامل</h1><p className="text-[10px] font-bold mt-1">العام الدراسي: {settings.academicYear}</p></div>
                                    <div className="text-xs font-black text-left space-y-1 w-[32%]"><p>المرحلة: {currentDept?.name} / {currentStage?.name}</p><p>الشعبة: {globalSec || "الكل"} | المادة: {globalSub || "---"}</p></div>
                                </div>
                                <table className="w-full border-collapse border-[2px] border-black text-[11px] text-black table-fixed">
                                    <thead>
                                        <tr className="bg-slate-100 text-center font-black">
                                            <th rowSpan="2" className="p-1 border border-black w-8">ت</th>
                                            <th rowSpan="2" className="p-1 border border-black text-right w-40 pr-2 text-xs">اسم الطالب</th>
                                            <th colSpan="3" className="p-1 border border-black">الفصل الأول</th>
                                            <th rowSpan="2" className="p-1 border border-black w-14">نصف السنة</th>
                                            <th colSpan="3" className="p-1 border border-black">الفصل الثاني</th>
                                            <th rowSpan="2" className="p-1 border border-black w-16">السعي السنوي</th>
                                            <th rowSpan="2" className="p-1 border border-black w-14">النهائي</th>
                                            <th rowSpan="2" className="p-1 border border-black w-12">قرار</th>
                                            <th rowSpan="2" className="p-1 border border-black w-14 bg-amber-50">دور ثان</th>
                                            <th rowSpan="2" className="p-1 border border-black w-16">النتيجة</th>
                                        </tr>
                                        <tr className="bg-slate-50 text-center font-bold text-[9px]">
                                            <th className="p-1 border border-black w-10">ش1</th><th className="p-1 border border-black w-10">ش2</th><th className="p-1 border border-black w-11">معدل</th>
                                            <th className="p-1 border border-black w-10">ش1</th><th className="p-1 border border-black w-10">ش2</th><th className="p-1 border border-black w-11">معدل</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredStudentsList.map((s, idx) => {
                                            const res = calculateResults(s.id, globalSub);
                                            const effectiveSaei = Math.min(maxAllowedGrade, res.saei + res.qarar);
                                            const finalScore = res.hasSecondRoundResult ? res.secondRoundResult : (res.hasFinalResult ? res.finalResult : (effectiveSaei));
                                            const status = res.hasSaei ? (finalScore >= failThreshold ? "ناجح" : "راسب") : "-";

                                            return (
                                                <tr key={s.id} className="h-7 text-center font-black">
                                                    <td className="p-1 border border-black">{idx + 1}</td>
                                                    <td className="p-1 border border-black text-[10px] pr-1 text-right truncate overflow-hidden whitespace-nowrap">{s.name} <span className="text-[7px] font-normal">({s.section})</span></td>
                                                    <td className="p-1 border border-black">{res.hasM1 ? res.m1 : '-'}</td>
                                                    <td className="p-1 border border-black">{res.hasM2 ? res.m2 : '-'}</td>
                                                    <td className="p-1 border border-black">{res.hasAvg1 ? res.avg1 : '-'}</td>
                                                    <td className="p-1 border border-black">{res.hasMid ? res.mid : '-'}</td>
                                                    <td className="p-1 border border-black">{res.hasM3 ? res.m3 : '-'}</td>
                                                    <td className="p-1 border border-black">{res.hasM4 ? res.m4 : '-'}</td>
                                                    <td className="p-1 border border-black">{res.hasAvg2 ? res.avg2 : '-'}</td>
                                                    <td className="p-1 border border-black">{res.isExempt ? '✨ معفي' : (res.hasSaei ? effectiveSaei : '-')}</td>
                                                    <td className="p-1 border border-black">{res.hasFinal ? res.finalExam : '-'}</td>
                                                    <td className="p-1 border border-black">{res.qarar > 0 ? `+${res.qarar}` : '-'}</td>
                                                    <td className="p-1 border border-black bg-amber-50">{res.hasSecondRound ? res.secondRoundExam : '-'}</td>
                                                    <td className="p-1 border border-black">{status}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>

                                {/* خلاصة الإحصائيات الرسمية والتوقيعات في أسفل السجل */}
                                <div className="pt-4 grid grid-cols-2 gap-8 items-center text-xs font-black text-black">
                                    <table className="w-full border-collapse border border-black text-center text-[10px]">
                                        <thead>
                                            <tr className="bg-slate-100">
                                                <th className="border border-black p-1">العدد الكلي</th>
                                                <th className="border border-black p-1">المشتركون</th>
                                                <th className="border border-black p-1">الناجحون</th>
                                                <th className="border border-black p-1">المكملون / الراسبون</th>
                                                <th className="border border-black p-1">نسبة النجاح</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td className="border border-black p-1">{stats.total}</td>
                                                <td className="border border-black p-1">{stats.activeCount}</td>
                                                <td className="border border-black p-1">{stats.passed}</td>
                                                <td className="border border-black p-1">{stats.failed}</td>
                                                <td className="border border-black p-1">{stats.rate}%</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <div className="flex justify-around text-center pt-2">
                                        <div>
                                            <p>توقيع مدرس المادة</p>
                                            <p className="mt-1 text-[11px]">{settings.teacherName}</p>
                                        </div>
                                        <div>
                                            <p>مصادقة وتوقيع مدير المدرسة</p>
                                            <p className="mt-1 text-[11px]">.................................</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AppWrapper = () => (
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppWrapper />);
    </script>
</body>
</html>

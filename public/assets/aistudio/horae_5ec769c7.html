<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>الواعد الذكي — النسخة الاحترافية المتكاملة</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; overflow: hidden; user-select: none; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .brand-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .modal-overlay { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); }
        .modal-enter { animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @media print { 
            @page { size: landscape; margin: 0.8cm; }
            .no-print, .no-print * { display: none !important; } 
            body { background: white !important; overflow: visible !important; color: black !important; } 
            table { border-collapse: collapse; width: 100%; border: 2px solid black !important; page-break-inside: auto; } 
            tr { page-break-inside: avoid; page-break-after: auto; }
            th, td { border: 1px solid black !important; padding: 5px 3px !important; font-size: 11px !important; text-align: center !important; color: black !important; font-weight: bold !important; } 
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; } 
        }
    </style>
</head>
<body class="text-slate-900 text-right">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const safeStorage = {
            get: (key, fallback) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : fallback;
                } catch(e) { return fallback; }
            },
            set: (key, value) => {
                try { 
                    localStorage.setItem(key, JSON.stringify(value)); 
                } catch(e) {
                    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
                        alert("⚠️ تنبيه خطير: ذاكرة المتصفح ممتلئة بالكامل!\nيرجى تصدير (حفظ) نسخة احتياطية فوراً، وتفريغ السجلات القديمة.");
                    }
                }
            }
        };

        const verifyActivationKey = (devId, code) => {
            if (!devId || !code) return false;
            const cleanId = devId.toString().replace(/[^0-9]/g, '');
            const cleanCode = code.toString().trim().toUpperCase().replace(/\s+/g, '');
            if (!cleanId) return false;
            const num = parseInt(cleanId, 10);
            const part1 = ((num * 1993) % 8999 + 1000).toString();
            const part2 = ((num * 2026) % 8999 + 1000).toString();
            return cleanCode === `WAAD-${part1}-${part2}`;
        };

        const AppLogo = ({ size = 30 }) => (
            <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5L15 20V45C15 67.5 30 88 50 95C70 88 85 67.5 85 45V20L50 5Z" fill="white" fillOpacity="0.15" stroke="white" strokeWidth="4"/>
                <path d="M35 65L45 55L55 60L65 45" stroke="white" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round"/>
                <circle cx="65" cy="45" r="5" fill="#fbbf24"/>
                <path d="M30 30L50 20L70 30L50 40L30 30Z" fill="white"/>
            </svg>
        );

        const svgIcons = {
            "save": <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>,

            "settings": <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,

            "user-plus": <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></>,
            "edit": <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,

            "users": <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
            "message-circle": <><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></>,

            "copy": <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
            "alert-triangle": <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>,
            "award": <><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></>,

            "calendar": <><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
            "clock": <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
            "moon": <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
            "sun": <><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>,
            "lock": <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
            "unlock": <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></>,
            "shield": <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>,
            "mic": <><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></>,
            "archive": <><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></>,
            "file-spreadsheet": <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></>,
            "star": <><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></>
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            const iconSvg = svgIcons[name] || svgIcons["layout-dashboard"];
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={{ display: 'inline-flex', flexShrink: 0 }}>
                    {iconSvg}
                </svg>
            );
        };

        const useDebounce = (value, delay) => {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { console.error("App Error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-center" dir="rtl">
                            <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full space-y-4 border-t-8 border-rose-500">
                                <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="alert-triangle" size={32}/></div>
                                <h1 className="text-xl font-black text-slate-800">حدث خطأ في النظام</h1>
                                <p className="text-xs font-bold text-slate-500 leading-relaxed">يرجى تحديث الصفحة. إذا استمرت المشكلة، قم بتفريغ مساحة تخزين المتصفح.</p>
                                <button onClick={() => window.location.reload()} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-black text-sm shadow mt-2">تحديث وإعادة تشغيل التطبيق</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const App = () => {
            const ADMIN_WHATSAPP = "9647727486682"; 
            const TRIAL_DAYS = 7; 
            const SUBSCRIPTION_DAYS = 365;

            const [darkMode, setDarkMode] = useState(() => safeStorage.get('WAAD_DARK_MODE', false));
            const [savedPin, setSavedPin] = useState(() => safeStorage.get('WAAD_PIN_CODE', ''));
            const [isLocked, setIsLocked] = useState(!!safeStorage.get('WAAD_PIN_CODE', ''));
            const [pinInput, setPinInput] = useState('');

            const [activationState, setActivationState] = useState(() => {
                let deviceID = localStorage.getItem('WAAD_DEVICE_ID');
                if (!deviceID) { 
                    deviceID = Math.floor(10000 + Math.random() * 90000).toString(); 
                    localStorage.setItem('WAAD_DEVICE_ID', deviceID); 
                }

                const savedToken = localStorage.getItem('WAAD_LICENSE_TOKEN');
                const activationDateStr = localStorage.getItem('WAAD_ACTIVATION_DATE');
                let isActivated = false;
                let subRemaining = 0;

                if (savedToken && verifyActivationKey(deviceID, savedToken) && activationDateStr) {
                    const actDate = parseInt(activationDateStr);
                    const daysPassed = (Date.now() - actDate) / (1000 * 60 * 60 * 24);
                    if (daysPassed <= SUBSCRIPTION_DAYS) {
                        isActivated = true;
                        subRemaining = Math.max(0, Math.ceil(SUBSCRIPTION_DAYS - daysPassed));
                    }
                }

                const installDateStr = localStorage.getItem('WAAD_INSTALL_DATE');
                let installDate = installDateStr ? parseInt(installDateStr) : Date.now();
                if (!installDateStr) localStorage.setItem('WAAD_INSTALL_DATE', installDate.toString());
                
                const trialDaysPassed = (Date.now() - installDate) / (1000 * 60 * 60 * 24);
                return { 
                    isActivated, 
                    isExpired: !isActivated && trialDaysPassed > TRIAL_DAYS, 
                    remainingTrialDays: Math.max(0, Math.ceil(TRIAL_DAYS - trialDaysPassed)), 
                    subRemainingDays: subRemaining, 
                    deviceID 
                };
            });

            const [activationInput, setActivationInput] = useState('');
            const [activationError, setActivationError] = useState('');
            const [isUnlockModalOpen, setIsUnlockModalOpen] = useState(false);

            const [students, setStudents] = useState(() => safeStorage.get('WAAD_STDS_V180', []));
            const [grades, setGrades] = useState(() => safeStorage.get('WAAD_GRADES_V180', {}));
            const [attendance, setAttendance] = useState(() => safeStorage.get('WAAD_ATTENDANCE_V180', {})); 
            const [studentTags, setStudentTags] = useState(() => safeStorage.get('WAAD_TAGS_V180', {})); 
            const [teacherSchedule, setTeacherSchedule] = useState(() => safeStorage.get('WAAD_SCHEDULE_V180', {}));
            
            const [settings, setSettings] = useState(() => {
                const defaults = { 
                    structure: [
                        { name: "الابتدائية", stages: [
                            { name: "الأول الابتدائي", maxGrade: 10, subjects: ["رياضيات", "قراءة"], sections: ["أ", "ب", "ج"] },
                            { name: "الخامس الابتدائي", maxGrade: 100, subjects: ["رياضيات", "علوم", "عربي"], sections: ["أ", "ب"] }
                        ]},
                        { name: "المتوسطة", stages: [{ name: "الأول المتوسط", maxGrade: 100, subjects: ["عربي", "إنجليزي"], sections: ["أ", "ب"] }] },
                        { name: "الإعدادية", stages: [{ name: "الرابع العلمي", maxGrade: 100, subjects: ["فيزياء", "كيمياء"], sections: ["أ"] }] }
                    ],
                    ministryName: "وزارة التربية", 
                    schoolName: "اسم المدرسة", 
                    academicYear: "2025 - 2026", 
                    teacherName: "المدرس المشرف" 
                };
                return { ...defaults, ...safeStorage.get('WAAD_SETTINGS_V180', {}) };
            });

            const [settingsForm, setSettingsForm] = useState({
                ministryName: settings?.ministryName || "",
                schoolName: settings?.schoolName || "",
                teacherName: settings?.teacherName || "",
                academicYear: settings?.academicYear || ""
            });

            const hasUnsavedSettings = useMemo(() => {
                return settingsForm.ministryName !== settings.ministryName ||
                       settingsForm.schoolName !== settings.schoolName ||
                       settingsForm.teacherName !== settings.teacherName ||
                       settingsForm.academicYear !== settings.academicYear;
            }, [settingsForm, settings]);

            const [view, setView] = useState('dashboard');
            const [toast, setToast] = useState(null);
            
            const [selDeptIdx, setSelDeptIdx] = useState(0); 
            const [selStageIdx, setSelStageIdx] = useState(0);
            
            const [globalSec, setGlobalSec] = useState('');
            const [globalSub, setGlobalSub] = useState(''); 
            const [search, setSearch] = useState('');
            const [sortFilter, setSortFilter] = useState('alpha');

            const [isBulkOpen, setIsBulkOpen] = useState(false);
            const [bulkText, setBulkText] = useState('');
            const [bulkTargetSec, setBulkTargetSec] = useState('');

            const [diceModal, setDiceModal] = useState({ isOpen: false, selectedStudent: null, isRolling: false });
            const [certificateModal, setCertificateModal] = useState({ isOpen: false }); 
            const [profileModal, setProfileModal] = useState({ isOpen: false, student: null });
            const [bonusModal, setBonusModal] = useState({ isOpen: false, student: null, subject: '', monthField: 'v1', baseGrade: 0, otherFieldsSum: 0, selectedBonus: 0 });
            const [attendanceDate, setAttendanceDate] = useState(() => new Date().toISOString().slice(0, 10));

            const [shareModal, setShareModal] = useState({ isOpen: false, student: null, parentPhone: '', reportScope: 'single' });
            
            const [speedConfig, setSpeedConfig] = useState({ activeIndex: 0, activeTab: 'm1', activeSubFieldIdx: 0 });
            const [isSpeedMode, setIsSpeedMode] = useState(false);
            const [isListeningVoice, setIsListeningVoice] = useState(false);
            const [isPrintMode, setIsPrintMode] = useState(false);

            const [formData, setFormData] = useState({ id: null, name: '', section: '', phone: '' });
            const [deleteModal, setDeleteModal] = useState(null);
            const [isDeleteMode, setIsDeleteMode] = useState(false);

            const debouncedGrades = useDebounce(grades, 1000);
            const debouncedStudents = useDebounce(students, 1000);
            const debouncedAttendance = useDebounce(attendance, 1000);

            useEffect(() => { safeStorage.set('WAAD_GRADES_V180', debouncedGrades); }, [debouncedGrades]);
            useEffect(() => { safeStorage.set('WAAD_STDS_V180', debouncedStudents); }, [debouncedStudents]);
            useEffect(() => { safeStorage.set('WAAD_ATTENDANCE_V180', debouncedAttendance); }, [debouncedAttendance]);
            
            useEffect(() => { safeStorage.set('WAAD_TAGS_V180', studentTags); }, [studentTags]);
            useEffect(() => { safeStorage.set('WAAD_SCHEDULE_V180', teacherSchedule); }, [teacherSchedule]);
            useEffect(() => { safeStorage.set('WAAD_SETTINGS_V180', settings); }, [settings]);
            useEffect(() => { safeStorage.set('WAAD_DARK_MODE', darkMode); }, [darkMode]);
            useEffect(() => { safeStorage.set('WAAD_PIN_CODE', savedPin); }, [savedPin]);

            // إغلاق وضع الطباعة تلقائياً بعد الانتهاء
            useEffect(() => {
                const handleAfterPrint = () => setIsPrintMode(false);
                window.addEventListener('afterprint', handleAfterPrint);
                return () => window.removeEventListener('afterprint', handleAfterPrint);
            }, []);

            const currentDept = useMemo(() => {
                const safeStruct = settings?.structure || [];
                return safeStruct[selDeptIdx] || safeStruct[0] || { name: "عام", stages: [{ name: "عام", subjects: ["عام"], sections: ["أ"] }] };
            }, [settings, selDeptIdx]);

            const currentStage = useMemo(() => {
                const safeStages = currentDept?.stages || [];
                return safeStages[selStageIdx] || safeStages[0] || { name: "عام", maxGrade: 100, subjects: ["عام"], sections: ["أ"] };
            }, [currentDept, selStageIdx]);

            const stageSections = currentStage?.sections || ["أ"];

            const currentLiveLesson = useMemo(() => {
                try {
                    const now = new Date();
                    const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const todayName = dayNames[now.getDay()];
                    const hour = now.getHours();
                    const minute = now.getMinutes();
                    const totalMinutes = hour * 60 + minute;

                    let lessonNum = 1;
                    if (totalMinutes >= 480 && totalMinutes < 525) lessonNum = 1;
                    else if (totalMinutes >= 530 && totalMinutes < 575) lessonNum = 2;
                    else if (totalMinutes >= 580 && totalMinutes < 625) lessonNum = 3;
                    else if (totalMinutes >= 645 && totalMinutes < 690) lessonNum = 4;
                    else if (totalMinutes >= 695 && totalMinutes < 740) lessonNum = 5;
                    else if (totalMinutes >= 745 && totalMinutes < 790) lessonNum = 6;

                    const schedKey = `${todayName}_${lessonNum}`;
                    const scheduledClass = (teacherSchedule && teacherSchedule[schedKey]) ? teacherSchedule[schedKey] : null;
                    return { dayName: todayName, lessonNum, scheduledClass };
                } catch(e) {
                    return { dayName: 'الأحد', lessonNum: 1, scheduledClass: null };
                }
            }, [teacherSchedule]);

            const jumpToLiveClass = () => {
                if (!currentLiveLesson.scheduledClass || !currentLiveLesson.scheduledClass.subject) {
                    showToast("لم تقم بتعيين جدول لهذه الحصة في إعدادات الجدول ⚠️");
                    setView('schedule');
                    return;
                }
                const cls = currentLiveLesson.scheduledClass;
                setSelDeptIdx(cls.deptIdx || 0);
                setSelStageIdx(cls.stageIdx || 0);
                setGlobalSec(cls.section || 'أ');
                setGlobalSub(cls.subject || '');
                setView('list');
                showToast(`تم الانتقال لشعبة (${cls.section}) مادة (${cls.subject}) تلقائياً ✅`);
            };

            const getStudentMaxGrade = useCallback((studentObj) => {
                const safeStruct = settings?.structure || [];
                if (studentObj) {
                    const dObj = safeStruct.find(d => d && d.name === studentObj.deptName);
                    const sObj = (dObj?.stages || []).find(s => s && s.name === studentObj.stageName);
                    if (sObj && sObj.maxGrade) return Number(sObj.maxGrade);
                    const stgName = (studentObj.stageName || "").trim();
                    const dptName = (studentObj.deptName || "").trim();
                    if ((dptName.includes("ابتدائ") || stgName.includes("ابتدائ")) && !stgName.includes("خامس") && !stgName.includes("سادس")) return 10;
                    return 100;
                }
                if (currentStage && currentStage.maxGrade) return Number(currentStage.maxGrade);
                const dept = (currentDept?.name || "").trim();
                const stage = (currentStage?.name || "").trim();
                if ((dept.includes("ابتدائ") || stage.includes("ابتدائ")) && !stage.includes("خامس") && !stage.includes("سادس")) return 10;
                return 100;
            }, [settings, currentDept, currentStage]);

            const maxAllowedGrade = useMemo(() => getStudentMaxGrade(null), [getStudentMaxGrade]);
            const failThreshold = maxAllowedGrade === 10 ? 5 : 50;

            useEffect(() => { setGlobalSec(''); }, [selDeptIdx, selStageIdx]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

            const checkAccess = () => {
                if (!activationState.isActivated && activationState.isExpired) {
                    showToast("انتهت الفترة التجريبية، يرجى تفعيل التطبيق ⚠️");
                    return false;
                }
                return true;
            };

            const handleActivation = () => {
                if (verifyActivationKey(activationState.deviceID, activationInput)) {

                    localStorage.setItem('WAAD_ACTIVATION_DATE', Date.now().toString());
                    setActivationState(prev => ({ ...prev, isActivated: true, isExpired: false, subRemainingDays: SUBSCRIPTION_DAYS }));
                    setIsUnlockModalOpen(false);
                    showToast("تم تفعيل التطبيق بنجاح لمدة عام كامل 🎉");
                } else {
                    setActivationError("كود التفعيل غير صحيح ❌");
                }
            };

            const handleSmartSubscribe = () => {
                const msg = `مرحباً أستاذ وعد، أود تفعيل تطبيق الواعد الذكي.\nمعرف جهازي هو: ${activationState.deviceID}`;
                window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
            };

            const handleArchiveAndReset = () => {
                if (window.confirm("تحذير: سيتم استخراج نسخة احتياطية لبيانات هذا العام، ثم سيتم تصفير جميع الدرجات والحضور لعام دراسي جديد. هل أنت متأكد؟")) {
                    downloadBackup();
                    setGrades({});
                    setAttendance({});
                    setStudentTags({});
                    showToast("تم الأرشفة وتصفير السجلات لبدء عام جديد ✅");
                }
            };

            const downloadBackup = () => { 
                if(!checkAccess()) return;
                const b = new Blob([JSON.stringify({students, grades, attendance, studentTags, teacherSchedule, settings})], {type:'application/json'}); 
                const a = document.createElement('a'); 
                a.href = URL.createObjectURL(b); 
                a.download = `WAAD_BACKUP_${new Date().toISOString().slice(0,10)}.json`; 
                a.click(); 
                showToast("تم تصدير النسخة الاحتياطية بنجاح 💾");
            };

            const handleRestoreWrapper = (e) => { 
                if (!checkAccess()) { e.target.value = ''; return; }
                const f = e.target.files[0]; 
                if (!f) return; 
                const r = new FileReader(); 
                r.onload = (ev) => { 
                    try { 
                        const j = JSON.parse(ev.target.result); 
                        if(j.students) { 
                            setStudents(j.students); 
                            setGrades(j.grades || {}); 
                            if(j.attendance) setAttendance(j.attendance);
                            if(j.studentTags) setStudentTags(j.studentTags);
                            if(j.teacherSchedule) setTeacherSchedule(j.teacherSchedule);
                            setSettings(p => ({...p, ...j.settings})); 
                            setSettingsForm({ 
                                ministryName: j.settings?.ministryName || "", 
                                schoolName: j.settings?.schoolName || "", 
                                teacherName: j.settings?.teacherName || "", 
                                academicYear: j.settings?.academicYear || "" 
                            });
                            showToast("تمت استعادة النسخة الاحتياطية بنجاح 🔄"); 
                        } 
                    } catch(err) { showToast("ملف النسخة الاحتياطية غير صالح ❌"); } 
                }; 
                r.readAsText(f); 
                e.target.value = '';
            };

            const handleSaveSettingsForm = () => {
                setSettings(prev => ({
                    ...prev,
                    ministryName: settingsForm.ministryName,
                    schoolName: settingsForm.schoolName,
                    teacherName: settingsForm.teacherName,
                    academicYear: settingsForm.academicYear
                }));
                showToast("تم حفظ الإعدادات الرسمية بنجاح ✅");
            };

            const addDept = (n) => { if(!n.trim()) return; setSettings(p => ({...p, structure: [...(p.structure||[]), {name: n.trim(), stages: []}]})); showToast("تمت إضافة المرحلة"); };
            const addStage = (n) => { 
                if(!n.trim()) return; 
                const s = JSON.parse(JSON.stringify(settings.structure || [])); 
                if (s[selDeptIdx]) { 
                    const isPrimaryLow = s[selDeptIdx].name.includes("ابتدائ") && !n.includes("خامس") && !n.includes("سادس");
                    s[selDeptIdx].stages.push({name: n.trim(), maxGrade: isPrimaryLow ? 10 : 100, subjects: [], sections: ["أ"]});

                    showToast("تمت إضافة الصف"); 
                }
            };
            const toggleStageMaxGrade = () => {
                const s = JSON.parse(JSON.stringify(settings.structure || []));
                if (s[selDeptIdx] && s[selDeptIdx].stages[selStageIdx]) {
                    const curMax = s[selDeptIdx].stages[selStageIdx].maxGrade || maxAllowedGrade;
                    const nextMax = curMax === 10 ? 100 : 10;
                    s[selDeptIdx].stages[selStageIdx].maxGrade = nextMax;
                    setSettings(prev => ({...prev, structure: s}));
                    showToast(`تم تغيير نظام تقييم (${currentStage?.name}) إلى ${nextMax}`);
                }
            };
            const addSub = (n) => { 
                if(!n.trim()) return; 
                const s = JSON.parse(JSON.stringify(settings.structure || [])); 
                if (s[selDeptIdx] && s[selDeptIdx].stages[selStageIdx]) { 
                    if (!s[selDeptIdx].stages[selStageIdx].subjects) s[selDeptIdx].stages[selStageIdx].subjects = [];
                    s[selDeptIdx].stages[selStageIdx].subjects.push(n.trim()); 
                    setSettings(prev => ({...prev, structure: s})); 
                    showToast("تمت إضافة المادة"); 
                }
            };
            const addSecToStage = (n) => { 
                if(!n.trim()) return; 
                const s = JSON.parse(JSON.stringify(settings.structure || [])); 
                if (s[selDeptIdx] && s[selDeptIdx].stages[selStageIdx]) { 
                    if(!s[selDeptIdx].stages[selStageIdx].sections) s[selDeptIdx].stages[selStageIdx].sections = []; 
                    if (!s[selDeptIdx].stages[selStageIdx].sections.includes(n.trim())) {
                        s[selDeptIdx].stages[selStageIdx].sections.push(n.trim()); 
                        setSettings(prev => ({...prev, structure: s})); 
                        showToast("تمت إضافة الشعبة ✅"); 
                    } else {
                        showToast("هذه الشعبة موجودة مسبقاً");
                    }
                }
            };

            const deleteStruct = (t, i) => { 
                const s = JSON.parse(JSON.stringify(settings.structure || [])); 
                if(t === 'd' && s[i]) { 
                    const deptName = s[i].name;
                    const removedStds = students.filter(st => st && st.deptName === deptName).map(st => st.id);
                    if (removedStds.length > 0) {
                        setStudents(prev => prev.filter(st => st && st.deptName !== deptName));
                        setGrades(prev => {
                            const next = { ...prev };
                            Object.keys(next).forEach(k => { if (removedStds.some(id => k.startsWith(`${id}_`))) delete next[k]; });
                            return next;
                        });
                    }
                    s.splice(i, 1); setSelDeptIdx(0); setSelStageIdx(0); 
                }
                else if(t === 's' && s[selDeptIdx] && s[selDeptIdx].stages[i]) { 
                    const stageName = s[selDeptIdx].stages[i].name;
                    const deptName = s[selDeptIdx].name;
                    const removedStds = students.filter(st => st && st.deptName === deptName && st.stageName === stageName).map(st => st.id);
                    if (removedStds.length > 0) {
                        setStudents(prev => prev.filter(st => !(st && st.deptName === deptName && st.stageName === stageName)));
                        setGrades(prev => {
                            const next = { ...prev };
                            Object.keys(next).forEach(k => { if (removedStds.some(id => k.startsWith(`${id}_`))) delete next[k]; });
                            return next;
                        });
                    }
                    s[selDeptIdx].stages.splice(i, 1); setSelStageIdx(0); 
                }
                else if(t === 'b' && s[selDeptIdx] && s[selDeptIdx].stages[selStageIdx] && s[selDeptIdx].stages[selStageIdx].subjects) { 
                    const subName = s[selDeptIdx].stages[selStageIdx].subjects[i];
                    s[selDeptIdx].stages[selStageIdx].subjects.splice(i, 1); 
                    if (globalSub === subName) setGlobalSub('');
                }
                else if(t === 'sec' && s[selDeptIdx] && s[selDeptIdx].stages[selStageIdx] && s[selDeptIdx].stages[selStageIdx].sections) { 
                    s[selDeptIdx].stages[selStageIdx].sections.splice(i, 1); 
                }
                setSettings(prev => ({...prev, structure: s})); 
                setDeleteModal(null); 
                showToast("تم الحذف وتنظيف السجلات بنجاح");
            };

            const calculateResults = useCallback((stdId, sub) => { 
                const k = `${stdId}_${sub}`; 
                const g = (grades && grades[k]) || {}; 

                const hasM1 = (g.v1 !== undefined && g.v1 !== '') || (g.v2 !== undefined && g.v2 !== '') || (g.v3 !== undefined && g.v3 !== '');
                const hasM2 = (g.v4 !== undefined && g.v4 !== '') || (g.v5 !== undefined && g.v5 !== '') || (g.v6 !== undefined && g.v6 !== '');
                const hasMid = g.mid !== undefined && g.mid !== '';
                const hasM3 = (g.v7 !== undefined && g.v7 !== '') || (g.v8 !== undefined && g.v8 !== '') || (g.v9 !== undefined && g.v9 !== '');
                const hasM4 = (g.v10 !== undefined && g.v10 !== '') || (g.v11 !== undefined && g.v11 !== '') || (g.v12 !== undefined && g.v12 !== '');
                const hasFinal = g.final !== undefined && g.final !== '';
                const hasSecondRound = g.secondRound !== undefined && g.secondRound !== '';

                const m1 = hasM1 ? (Number(g.v1||0) + Number(g.v2||0) + Number(g.v3||0)) : 0;
                const m2 = hasM2 ? (Number(g.v4||0) + Number(g.v5||0) + Number(g.v6||0)) : 0;
                const mid = hasMid ? Number(g.mid) : 0;
                const m3 = hasM3 ? (Number(g.v7||0) + Number(g.v8||0) + Number(g.v9||0)) : 0;
                const m4 = hasM4 ? (Number(g.v10||0) + Number(g.v11||0) + Number(g.v12||0)) : 0;
                const finalExam = hasFinal ? Number(g.final) : 0;
                const secondRoundExam = hasSecondRound ? Number(g.secondRound) : 0;
                const qarar = Number(g.qarar || 0);

                const hasAvg1 = hasM1 || hasM2;
                const avg1 = hasAvg1 ? Math.round((m1 + m2) / ((hasM1 && hasM2) ? 2 : 1)) : 0;
                const hasAvg2 = hasM3 || hasM4;
                const avg2 = hasAvg2 ? Math.round((m3 + m4) / ((hasM3 && hasM4) ? 2 : 1)) : 0;

                let saei = 0; let hasSaei = false;
                if (hasAvg2 && hasMid && hasAvg1) { saei = Math.round((avg1 + mid + avg2) / 3); hasSaei = true; }
                else if (hasMid && hasAvg1) { saei = Math.round((avg1 + mid) / 2); hasSaei = true; }
                else if (hasAvg1) { saei = avg1; hasSaei = true; }

                const isExempt = maxAllowedGrade === 100 && hasSaei && saei >= 90;

                let finalResult = 0; let hasFinalResult = false;
                if (isExempt) {
                    finalResult = saei;
                    hasFinalResult = true;
                } else if (hasSaei && hasFinal) {
                    finalResult = Math.min(maxAllowedGrade, Math.round((saei + finalExam) / 2) + qarar);
                    hasFinalResult = true;
                } else if (hasSaei) {
                    finalResult = Math.min(maxAllowedGrade, saei + qarar);
                }

                let isFailedFirstRound = hasFinalResult && finalResult < failThreshold;
                let secondRoundResult = null;
                let hasSecondRoundResult = false;
                if (isFailedFirstRound && hasSecondRound) {
                    secondRoundResult = secondRoundExam;
                    hasSecondRoundResult = true;
                }

                return { 
                    m1, m2, avg1, mid, m3, m4, avg2, saei, finalExam, secondRoundExam, qarar, finalResult, secondRoundResult,
                    hasM1, hasM2, hasAvg1, hasMid, hasM3, hasM4, hasAvg2, hasSaei, hasFinal, hasFinalResult, 
                    isExempt, isFailedFirstRound, hasSecondRound, hasSecondRoundResult
                }; 
            }, [grades, maxAllowedGrade, failThreshold]);

            const speedList = useMemo(() => {
                if (!Array.isArray(students)) return [];
                return students.filter(s => s && s.deptName === currentDept?.name && s.stageName === currentStage?.name && (globalSec === '' || s.section === globalSec))
                               .sort((a, b) => (a?.name || "").localeCompare(b?.name || "", 'ar'));
            }, [students, currentDept?.name, currentStage?.name, globalSec]);

            const getInstantMonthTotal = () => { 
                if (!speedList || !speedList[speedConfig.activeIndex] || !globalSub) return 0; 
                const std = speedList[speedConfig.activeIndex];
                const g = (grades && grades[`${std.id}_${globalSub}`]) || {}; 
                const t = speedConfig.activeTab || 'm1'; 
                if (t === 'mid') return Number(g.mid || 0); 
                if (t === 'final') return Number(g.final || 0);
                if (t === 'secondRound') return Number(g.secondRound || 0);
                const mIdx = parseInt(t.slice(1)) || 1; 
                const start = (mIdx - 1) * 3 + 1; 
                return (Number(g[`v${start}`] || 0) + Number(g[`v${start+1}`] || 0) + Number(g[`v${start+2}`] || 0)); 
            };

            const stats = useMemo(() => { 
                const filtered = (Array.isArray(students) ? students : []).filter(s => s && s.deptName === currentDept?.name && s.stageName === currentStage?.name && (globalSec==='' || s.section===globalSec)); 
                let passed = 0, failed = 0, activeCount = 0; 

                filtered.forEach(s => { 
                    if (globalSub !== '') { 
                        const res = calculateResults(s.id, globalSub); 
                        if (res.hasSaei) { 
                            activeCount++; 
                            const finalScore = res.hasSecondRoundResult ? res.secondRoundResult : (res.hasFinalResult ? res.finalResult : Math.min(maxAllowedGrade, res.saei + res.qarar));
                            (finalScore >= failThreshold) ? passed++ : failed++; 
                        }
                    } else { 
                        const subs = currentStage?.subjects || []; 
                        if (subs.length) { 
                            let sum = 0, validSubs = 0; 
                            subs.forEach(sub => { 
                                const r = calculateResults(s.id, sub); 
                                if (r.hasSaei) { 
                                    sum += (r.hasSecondRoundResult ? r.secondRoundResult : (r.hasFinalResult ? r.finalResult : Math.min(maxAllowedGrade, r.saei + r.qarar))); 
                                    validSubs++; 
                                } 
                            }); 
                            if (validSubs > 0) { activeCount++; ((sum / validSubs) >= failThreshold) ? passed++ : failed++; }
                        } 
                    } 
                }); 
                const total = filtered.length; 
                const rate = activeCount ? ((passed / activeCount) * 100).toFixed(1) : "0.0"; 
                return { total, activeCount, passed, failed, rate, labelText: globalSub ? `نسبة (${globalSub})` : "نسبة النجاح العامة" }; 
            }, [students, calculateResults, currentDept?.name, currentStage?.name, currentStage?.subjects, globalSec, globalSub, failThreshold, maxAllowedGrade]);

            const filteredStudentsList = useMemo(() => {
                if (!Array.isArray(students)) return [];
                const activeSub = globalSub || currentStage?.subjects?.[0] || '';
                let list = students.filter(s => s && (s.name || "").toLowerCase().includes((search || "").toLowerCase()) && s.deptName === currentDept?.name && s.stageName === currentStage?.name && (globalSec === '' || s.section === globalSec));
                
                if (sortFilter === 'fail' && activeSub) {
                    list = list.filter(s => {
                        const r = calculateResults(s.id, activeSub);
                        const score = r.hasSecondRoundResult ? r.secondRoundResult : (r.hasFinalResult ? r.finalResult : (r.saei + r.qarar));
                        return r.hasSaei && score < failThreshold;
                    });
                }
                return list.sort((a, b) => {
                    if (sortFilter === 'high' && activeSub) return calculateResults(b.id, activeSub).saei - calculateResults(a.id, activeSub).saei;
                    if (sortFilter === 'low' && activeSub) return calculateResults(a.id, activeSub).saei - calculateResults(b.id, activeSub).saei;
                    return (a?.name || "").localeCompare(b?.name || "", 'ar');
                });
            }, [students, search, currentDept?.name, currentStage?.name, globalSec, sortFilter, globalSub, calculateResults, failThreshold]);
            
            const handleSaveStudent = () => { 
                if(!formData.name.trim() || !formData.section) return showToast("يرجى إكمال الاسم والشعبة"); 
                if (formData.id) {
                    setStudents(prev => prev.map(s => s && s.id === formData.id ? {
                        ...s,
                        name: formData.name.trim(),
                        section: formData.section,
                        phone: (formData.phone || '').trim()
                    } : s));
                    setFormData({id: null, name: '', section: stageSections[0] || '', phone: ''});
                    setView('list');
                    showToast("تم تحديث بيانات الطالب بنجاح ✅");
                } else {
                    const newStd = { 
                        id: Date.now() + "_" + Math.random().toString(36).substr(2, 5), 
                        name: formData.name.trim(), 
                        section: formData.section, 
                        phone: (formData.phone || '').trim(),
                        deptName: currentDept?.name || "", 
                        stageName: currentStage?.name || "" 
                    }; 
                    setStudents([...students, newStd]); 
                    setFormData({id: null, name: '', section: formData.section, phone: ''}); 
                    showToast("تمت إضافة الطالب ✅"); 
                }
            };

            const handleEditStudent = (std) => {
                if(!std) return;
                setFormData({
                    id: std.id,
                    name: std.name,
                    section: std.section,
                    phone: std.phone || ''
                });
                setView('entry');
            };

            const handleDeleteStudent = (stdId) => {
                if (window.confirm("هل أنت متأكد من حذف هذا الطالب نهائياً من السجل؟")) {
                    setStudents(prev => prev.filter(s => s && s.id !== stdId));
                    setGrades(prev => {
                        const next = { ...prev };
                        Object.keys(next).forEach(k => { if (k.startsWith(`${stdId}_`)) delete next[k]; });
                        return next;
                    });
                    showToast("تم حذف الطالب بنجاح 🗑️");
                }
            };

            const handleSmartBulkAdd = () => { 
                if(!bulkText.trim()) return; 
                const lines = bulkText.split('\n');
                const defaultSec = bulkTargetSec || stageSections[0] || "أ";
                const newStds = [];

                lines.forEach((line, idx) => {
                    let text = line.trim(); if (text.length < 2) return;
                    let namePart = text; let secPart = defaultSec;

                    if (text.includes('\t')) { const p = text.split('\t'); namePart = p[0]; if (p[1]?.trim()) secPart = p[1].trim(); }
                    else if (text.includes(',')) { const p = text.split(','); namePart = p[0]; if (p[1]?.trim()) secPart = p[1].trim(); }
                    namePart = namePart.replace(/^[\d\s\-\.\•\*\#\)]+/, '').trim();

                    if (namePart.length >= 2) {
                        newStds.push({ id: `${Date.now()}_${idx}`, name: namePart, section: secPart, phone: '', deptName: currentDept?.name || "", stageName: currentStage?.name || "" });
                    }
                });

                if (newStds.length > 0) {
                    setStudents([...students, ...newStds]); setBulkText(''); setIsBulkOpen(false); showToast(`تم إضافة ${newStds.length} طالب ✅`); 
                } else { showToast("لم يتم العثور على أسماء صالحة"); }
            };

            const pickRandomStudent = () => {
                const list = students.filter(s => s && s.deptName === currentDept?.name && s.stageName === currentStage?.name && (globalSec === '' || s.section === globalSec));
                if (list.length === 0) {
                    showToast("لا يوجد طلاب متاحون في هذا النطاق للقرعة ⚠️");
                    return;
                }
                setDiceModal({ isOpen: true, selectedStudent: null, isRolling: true });
                let counter = 0;
                const interval = setInterval(() => {
                    const randomIdx = Math.floor(Math.random() * list.length);
                    setDiceModal(prev => ({ ...prev, selectedStudent: list[randomIdx] }));
                    counter++;
                    if (counter > 12) {
                        clearInterval(interval);
                        setDiceModal(prev => ({ ...prev, isRolling: false }));
                    }
                }, 80);
            };

            const setStudentTag = (stdId, tagText) => {
                const current = studentTags[stdId] || [];
                const updated = current.includes(tagText) ? current.filter(t => t !== tagText) : [...current, tagText];
                setStudentTags(prev => ({ ...prev, [stdId]: updated }));
            };

            const setStudentAttendanceStatus = (stdId, status) => {
                const key = `${stdId}_${attendanceDate}`;
                setAttendance(prev => {
                    const next = { ...prev, [key]: status };
                    const stdAbsents = Object.keys(next).filter(k => k.startsWith(`${stdId}_`) && next[k] === 'absent').length;
                    if (stdAbsents === 10) showToast(`⚠️ تنبيه قانوني: الطالب وصل إلى 10 أيام غياب (إنذار أولي)!`);
                    if (stdAbsents === 15) showToast(`⚠️ تنبيه قانوني: الطالب وصل إلى 15 يوم غياب (إنذار نهائي)!`);
                    if (stdAbsents === 21) showToast(`❌ تنبيه قانوني: الطالب تجاوز 21 يوم غياب (فصل بالغياب)!`);
                    return next;
                });
            };

            // دوال الدرجات التشجيعية والقرار المفعلة
            const getMonthOtherSum = useCallback((stdId, sub, mField) => {
                const key = `${stdId}_${sub}`;
                const g = (grades && grades[key]) ? grades[key] : {};
                const fNum = parseInt(mField.slice(1), 10) || 1;
                const mStart = Math.floor((fNum - 1) / 3) * 3 + 1;
                return (fNum !== mStart ? Number(g[`v${mStart}`] || 0) : 0) +
                       (fNum !== mStart+1 ? Number(g[`v${mStart+1}`] || 0) : 0) +
                       (fNum !== mStart+2 ? Number(g[`v${mStart+2}`] || 0) : 0);
            }, [grades]);

            const openBonusModal = (std) => {
                const sub = globalSub || currentStage?.subjects?.[0] || '';
                if (!sub) return showToast("يرجى إضافة مواد أولاً");
                const key = `${std.id}_${sub}`;
                const g = (grades && grades[key]) ? grades[key] : {};
                const currentVal = Number(g.v1 || 0);
                const otherSum = getMonthOtherSum(std.id, sub, 'v1');
                setBonusModal({ isOpen: true, student: std, subject: sub, monthField: 'v1', baseGrade: currentVal, otherFieldsSum: otherSum, selectedBonus: 0 });
            };

            const handleSubjectChangeInBonus = (newSub) => {
                if (!bonusModal.student) return;
                const key = `${bonusModal.student.id}_${newSub}`;
                const g = (grades && grades[key]) ? grades[key] : {};
                const val = Number(g[bonusModal.monthField] || 0);
                const otherSum = getMonthOtherSum(bonusModal.student.id, newSub, bonusModal.monthField);
                setBonusModal(prev => ({ ...prev, subject: newSub, baseGrade: val, otherFieldsSum: otherSum, selectedBonus: 0 }));
            };

            const handleMonthFieldChangeInBonus = (newField) => {
                if (!bonusModal.student) return;
                const key = `${bonusModal.student.id}_${bonusModal.subject}`;
                const g = (grades && grades[key]) ? grades[key] : {};
                const val = Number(g[newField] || 0);
                const otherSum = getMonthOtherSum(bonusModal.student.id, bonusModal.subject, newField);
                setBonusModal(prev => ({ ...prev, monthField: newField, baseGrade: val, otherFieldsSum: otherSum, selectedBonus: 0 }));
            };

            const applyBonusIncrement = (bonusVal) => {
                if (!bonusModal.student) return;
                const bonusPts = Number(bonusVal);
                if (isNaN(bonusPts)) return;

                const curMax = getStudentMaxGrade(bonusModal.student);
                const base = Number(bonusModal.baseGrade || 0);
                const otherSum = Number(bonusModal.otherFieldsSum || 0);
                const newFieldVal = base + bonusPts;
                const totalMonthWithBonus = newFieldVal + otherSum;

                if (bonusPts > 0 && totalMonthWithBonus > curMax) {
                    showToast(`❌ ممنوع! مجموع الشهر (${totalMonthWithBonus}) يتجاوز سقف المرحلة (${curMax})`);
                    return;
                }

                const key = `${bonusModal.student.id}_${bonusModal.subject}`;
                setBonusModal(prev => ({ ...prev, selectedBonus: bonusPts }));
                setGrades(prev => ({ ...prev, [key]: { ...(prev[key] || {}), [bonusModal.monthField]: newFieldVal.toString() } }));
                showToast(`⭐ تمت إضافة الدرجة التشجيعية بنجاح`);
            };

            const handleApplyQarar = (stdId, sub, neededPts = 5) => {
                const key = `${stdId}_${sub}`;
                const g = (grades && grades[key]) ? grades[key] : {};
                const currentQarar = Number(g.qarar || 0);
                const nextQarar = currentQarar > 0 ? 0 : neededPts;
                setGrades(prev => ({ ...prev, [key]: { ...(prev[key] || {}), qarar: nextQarar } }));
                if (nextQarar > 0) showToast(`⚖️ تم منح +${nextQarar} درجة قرار للطالب في مادة (${sub}) ✅`);
                else showToast(`تم إلغاء درجة القرار لمادة (${sub})`);
            };

            const parseSpokenNumber = (txt) => {
                const clean = txt.trim().toLowerCase();
                const numMap = {
                    'صفر': 0, 'واحد': 1, 'إثنين': 2, 'اثنان': 2, 'ثلاثة': 3, 'أربعة': 4, 'خمسة': 5, 'ستة': 6, 'سبعة': 7, 'ثمانية': 8, 'تسعة': 9, 'عشرة': 10,
                    'أحد عشر': 11, 'اثنا عشر': 12, 'ثلاثة عشر': 13, 'أربعة عشر': 14, 'خمسة عشر': 15, 'ستة عشر': 16, 'سبعة عشر': 17, 'ثمانية عشر': 18, 'تسعة عشر': 19, 'عشرون': 20,
                    'ثلاثون': 30, 'أربعون': 40, 'خمسون': 50, 'ستون': 60, 'سبعون': 70, 'ثمانون': 80, 'تسعون': 90, 'مئة': 100, 'كامل': maxAllowedGrade
                };
                if (numMap[clean] !== undefined) return numMap[clean];
                const digits = clean.replace(/[^0-9]/g, '');
                if (digits) return parseInt(digits, 10);
                return null;
            };

            const startVoiceRecognition = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    showToast("❌ متصفحك الحالي لا يدعم الصوت. يرجى فتح التطبيق في Google Chrome.");
                    return;
                }
                try {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'ar-IQ'; 
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;

                    setIsListeningVoice(true);
                    showToast("🎙️ تحدث الآن بصوت واضح... (مثلاً: خمسة عشر)");

                    recognition.onresult = (event) => {
                        const speechResult = event.results[0][0].transcript.trim();
                        setIsListeningVoice(false);
                        const val = parseSpokenNumber(speechResult);
                        
                        if (val !== null && !isNaN(val)) {
                            if (val >= 0 && val <= maxAllowedGrade) {
                                const curStd = speedList[speedConfig.activeIndex];
                                if (curStd) {
                                    let tabField = 'v1';
                                    if (speedConfig.activeTab === 'mid') tabField = 'mid';
                                    else if (speedConfig.activeTab === 'final') tabField = 'final';
                                    else if (speedConfig.activeTab === 'secondRound') tabField = 'secondRound';
                                    else {
                                        const mIdx = parseInt((speedConfig.activeTab || 'm1').slice(1)) || 1;
                                        const subIdx = speedConfig.activeSubFieldIdx || 0;
                                        tabField = `v${(mIdx - 1) * 3 + subIdx + 1}`;
                                    }

                                    const fakeEvent = { target: { value: val.toString() } };
                                    handleGradeChange(fakeEvent, curStd.id, tabField);
                                    showToast(`🎙️ تم رصد الدرجة (${val}) للطالب بنجاح ✅`);
                                    
                                    setTimeout(() => {
                                        if (speedConfig.activeIndex < speedList.length - 1) {
                                            setSpeedConfig(prev => ({ ...prev, activeIndex: prev.activeIndex + 1 }));
                                        }
                                    }, 800);
                                }
                            } else {
                                showToast(`❌ الرقم المنطوق (${val}) يتجاوز السقف (${maxAllowedGrade})`);
                            }
                        } else {
                            showToast(`لم يتم التعرف على أرقام في كلامك: "${speechResult}" ⚠️`);
                        }
                    };

                    recognition.onerror = (event) => {
                        setIsListeningVoice(false);
                        if(event.error === 'not-allowed') showToast("🎤 يرجى إعطاء صلاحية المايكروفون للمتصفح.");
                        else if(event.error === 'network') showToast("🌐 يرجى التحقق من اتصال الإنترنت.");
                        else showToast(`❌ خطأ صوتي: ${event.error}`);
                    };

                    recognition.onend = () => { setIsListeningVoice(false); };
                    recognition.start();
                } catch (err) {
                    setIsListeningVoice(false);
                    showToast("❌ حدث خطأ في تشغيل خدمة الصوت.");
                }
            };

            const handleGradeChange = (e, curStdId, fieldName) => {
                if (!curStdId) return;
                const rawValue = e.target.value;
                const key = `${curStdId}_${globalSub}`;
                const currentStdGrades = (grades && grades[key]) ? grades[key] : {};

                if (rawValue === '') {
                    setGrades(prev => ({ ...prev, [key]: { ...(prev[key] || {}), [fieldName]: '' } }));
                    return;
                }

                const num = Number(rawValue);
                const prevVal = currentStdGrades[fieldName] || '';
                if (isNaN(num) || num < 0) { e.target.value = prevVal; return; }

                if (fieldName.startsWith('v')) {
                    const fNum = parseInt(fieldName.slice(1), 10);
                    const mStart = Math.floor((fNum - 1) / 3) * 3 + 1;
                    const otherSum = (fNum !== mStart ? Number(currentStdGrades[`v${mStart}`] || 0) : 0) +
                                     (fNum !== mStart+1 ? Number(currentStdGrades[`v${mStart+1}`] || 0) : 0) +
                                     (fNum !== mStart+2 ? Number(currentStdGrades[`v${mStart+2}`] || 0) : 0);

                    if (num + otherSum > maxAllowedGrade) {
                        e.target.value = prevVal;
                        showToast(`❌ مرفوض! مجموع الشهر سيتجاوز (${maxAllowedGrade}).`);
                        return;
                    }
                } else {
                    if (num > maxAllowedGrade) {
                        e.target.value = prevVal;
                        showToast(`❌ الدرجة مرفوضة! سقف الدرجة هو ${maxAllowedGrade}`);
                        return;
                    }
                }
                setGrades(prev => ({ ...prev, [key]: { ...(prev[key] || {}), [fieldName]: num.toString() } }));
            };

            const exportToExcelCSV = () => {
                const sub = globalSub || currentStage?.subjects?.[0];
                if (!sub) return showToast("يرجى اختيار المادة أولاً لتصدير الكشف");
                
                const headers = ["ت", "اسم الطالب", "الشعبة", "شهر 1", "شهر 2", "معدل ف1", "نصف السنة", "شهر 1", "شهر 2", "معدل ف2", "السعي السنوي", "النهائي", "الدور الثاني", "القرار", "النتيجة النهائية"];
                const rows = filteredStudentsList.map((s, idx) => {
                    const r = calculateResults(s.id, sub);
                    const finalScore = r.hasSecondRoundResult ? r.secondRoundResult : (r.hasFinalResult ? r.finalResult : (r.saei + r.qarar));
                    const status = r.hasSaei ? (finalScore >= failThreshold ? "ناجح" : "راسب") : "غير مرصود";
                    return [
                        idx + 1,
                        `"${s.name}"`,
                        `"${s.section}"`,
                        r.hasM1 ? r.m1 : "-",
                        r.hasM2 ? r.m2 : "-",
                        r.hasAvg1 ? r.avg1 : "-",
                        r.hasMid ? r.mid : "-",
                        r.hasM3 ? r.m3 : "-",
                        r.hasM4 ? r.m4 : "-",
                        r.hasAvg2 ? r.avg2 : "-",
                        r.hasSaei ? r.saei : "-",
                        r.hasFinal ? r.finalExam : "-",
                        r.hasSecondRound ? r.secondRoundExam : "-",
                        r.qarar || 0,
                        status
                    ].join(",");
                });

                const csvContent = "\uFEFF" + [headers.join(","), ...rows].join("\n");
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `سجل_${currentStage?.name || 'عام'}_${sub}.csv`;
                link.click();
                showToast("تم تصدير ملف Excel بنجاح 📊");
            };

                       const buildWhatsAppMessage = (student, scope) => {
                if (!student) return "";
                const activeSub = globalSub || currentStage?.subjects?.[0] || "المادة العامة";
                const subs = scope === 'single' ? [activeSub] : (currentStage?.subjects || [activeSub]);
                const stdMax = getStudentMaxGrade(student);
                const stdFail = stdMax === 10 ? 5 : 50;

                // جلب تقييمات السلوك (الوسوم) والغيابات للطالب
                const tags = (studentTags && studentTags[student.id]) ? studentTags[student.id] : [];
                const absentsCount = Object.keys(attendance || {}).filter(k => k.startsWith(`${student.id}_`) && attendance[k] === 'absent').length;

                let msg = `السلام عليكم ورحمة الله وبركاته 🌹\n*إشعار درجات ومستوى الطالب الأكاديمي*\n━━━━━━━━━━━━━━━━━━━━\n`;
                msg += `🏫 *المدرسة:* ${settings.schoolName}\n👤 *الطالب:* ${student.name}\n📚 *المرحلة:* ${student.deptName} - ${student.stageName} (${student.section})\n📅 *العام الدراسي:* ${settings.academicYear}\n`;
                
                // إضافة السلوك والغياب في ترويسة الرسالة
                msg += `⭐ *تقييم السلوك والمستوى:* ${tags.length > 0 ? tags.join(' ، ') : 'جيد جداً (طبيعي)'}\n`;
                if (absentsCount > 0) {
                    msg += `⚠️ *أيام الغياب المسجلة:* ${absentsCount} يوم\n`;
                }
                msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;

                subs.forEach(sub => {
                    const res = calculateResults(student.id, sub);
                    msg += `📖 *مادة: ${sub}*\n`;
                    if (res.hasM1 || res.hasM2) msg += `• الفصل الأول: ش1 (${res.hasM1 ? res.m1 : '-'}) | ش2 (${res.hasM2 ? res.m2 : '-'}) | المعدل (${res.hasAvg1 ? res.avg1 : '-'})\n`;
                    if (res.hasMid) msg += `• نصف السنة: (${res.mid})\n`;
                    if (res.hasM3 || res.hasM4) msg += `• الفصل الثاني: ش1 (${res.hasM3 ? res.m3 : '-'}) | ش2 (${res.hasM4 ? res.m4 : '-'}) | المعدل (${res.hasAvg2 ? res.avg2 : '-'})\n`;
                    msg += `• السعي السنوي: (${res.hasSaei ? Math.min(stdMax, res.saei + res.qarar) : '-'}) ${res.isExempt ? '✨ (معفي)' : ''}\n`;
                    if (res.hasFinalResult) msg += `• الدرجة النهائية: (${res.finalResult})\n`;
                    if (res.hasSecondRoundResult) msg += `• نتيجة الدور الثاني: (${res.secondRoundResult}) - ${res.secondRoundResult >= stdFail ? 'ناجح دور ثان ✅' : 'راسب ⚠️'}\n`;
                    msg += `────────────────────\n`;
                });
                if (settings.teacherName) msg += `\n👨‍🏫 *المدرس:* ${settings.teacherName}\n`;
                return msg;
            };

            const startGradingMode = () => {
                if (!globalSub) { showToast("يرجى اختيار المادة للرصد"); return; }
                setSpeedConfig({ activeIndex: 0, activeTab: 'm1', activeSubFieldIdx: 0 });
                setIsSpeedMode(true);
            };

            if (isLocked) {
                return (
                    <div className={`fixed inset-0 flex items-center justify-center p-6 ${darkMode ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-900'}`} dir="rtl">
                        <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} w-full max-w-sm p-8 rounded-[35px] shadow-2xl text-center space-y-4 border-t-8 border-indigo-600`}>
                            <div className="w-16 h-16 bg-indigo-500/20 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-2"><Icon name="lock" size={32}/></div>
                            <h1 className="text-xl font-black">التطبيق مقفل</h1>
                            <p className="text-[10px] text-slate-400 font-bold">يرجى إدخال رمز المرور (PIN) للوصول إلى السجلات.</p>
                            <input type="password" pattern="[0-9]*" inputMode="numeric" value={pinInput} onChange={e => { setPinInput(e.target.value); if (e.target.value === savedPin) { setIsLocked(false); setPinInput(''); } }} placeholder="رمز المرور (PIN)" className={`w-full h-14 border-2 rounded-2xl text-center font-black text-2xl tracking-[1em] outline-none ${darkMode ? 'bg-slate-900 border-slate-600 focus:border-indigo-500 text-white' : 'bg-slate-50 focus:border-indigo-500'}`}/>
                            {pinInput.length > 0 && pinInput !== savedPin && <p className="text-rose-500 text-[10px] font-bold">رمز المرور غير صحيح</p>}
                        </div>
                    </div>
                );
            }

            if (!activationState.isActivated && activationState.isExpired) { 
                return ( 
                    <div className="fixed inset-0 bg-slate-100 flex items-center justify-center p-6 text-right" dir="rtl">
                        <div className="bg-white w-full max-w-md p-8 rounded-[35px] shadow-2xl text-center space-y-4 border border-slate-200">
                            <div className="w-16 h-16 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-2 text-rose-500"><Icon name="lock" size={32}/></div>
                            <h1 className="text-xl font-black text-slate-800">انتهت الفترة التجريبية</h1>
                            <p className="text-slate-500 text-xs leading-relaxed font-bold">يرجى تجديد الاشتراك السنوي للاستمرار في استخدام التطبيق.</p>
                            <div className="bg-slate-50 p-2.5 rounded-xl border text-xs font-mono font-bold text-slate-600">المعرف: <span className="text-indigo-600 font-black">{activationState.deviceID}</span></div>
                            <button onClick={handleSmartSubscribe} className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-black shadow flex items-center justify-center gap-2 text-xs"><Icon name="message-circle" size={16}/> طلب التفعيل عبر واتساب</button>
                            <div className="pt-2 border-t space-y-2">
                                <input className="w-full h-11 border-2 rounded-xl text-center font-black uppercase text-xs outline-none focus:border-indigo-500" placeholder="أدخل كود التفعيل" value={activationInput} onChange={e=>setActivationInput(e.target.value)}/>
                                {activationError && <p className="text-rose-500 text-[10px] font-bold">{activationError}</p>}
                                <button onClick={handleActivation} className="w-full h-11 bg-slate-900 text-white rounded-xl font-black text-xs">تفعيل الترخيص</button>
                            </div>
                        </div>
                    </div> 
                ); 
            }

            return (
                <div className={`fixed inset-0 flex flex-col ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-900'} text-right select-none overflow-hidden text-sm`}>
                    {toast && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-[3500] bg-slate-900 text-white px-5 py-2 rounded-full shadow-2xl font-bold text-xs animate-in slide-in-from-top-4">{toast}</div>}

                    {!isPrintMode && !isSpeedMode && (
                        <header className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} border-b px-3.5 py-2 flex flex-col z-40 shadow-sm no-print`}>
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-2.5">
                                    <div className="p-1 brand-gradient rounded-xl shadow-md"><AppLogo size={26}/></div>
                                    <div>
                                        <h1 className={`text-xs font-black leading-tight ${darkMode ? 'text-white' : 'text-slate-800'}`}>الواعد الذكي</h1>
                                        <p className="text-[9px] font-bold text-indigo-500">الأستاذ : وعد بزيع</p>

                                <div className="flex items-center gap-1.5">
                                    <button onClick={() => setDarkMode(!darkMode)} title="الوضع الليلي" className={`w-8 h-8 rounded-lg flex items-center justify-center border ${darkMode ? 'bg-slate-700 border-slate-600 text-yellow-400' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                        <Icon name={darkMode ? "sun" : "moon"} size={14}/>
                                    </button>
                                    {!activationState.isActivated ? (
                                        <button onClick={()=>setIsUnlockModalOpen(true)} className={`px-2.5 py-1 ${darkMode ? 'bg-amber-900/40 text-amber-400 border-amber-800' : 'bg-amber-50 text-amber-700 border-amber-200'} border rounded-lg text-[10px] font-black`}>باقي {activationState.remainingTrialDays} يوم</button>
                                    ) : (
                                        <div className={`px-2 py-0.5 ${darkMode ? 'bg-indigo-900/40 text-indigo-300 border-indigo-800' : 'bg-indigo-50 text-indigo-700 border-indigo-200'} border rounded-lg text-[9px] font-black`}>سنوي</div>

                                    <button onClick={() => setView('settings')} title="الإعدادات" className={`w-8 h-8 rounded-lg flex items-center justify-center border ${darkMode ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 text-slate-600'}`}>

                    {!isSpeedMode && !isPrintMode && (

                            {view === 'dashboard' && (

                                    <div className="flex items-center justify-between border-b border-white/10 pb-2">
                                        <div className="flex items-center gap-2">

                                            <span className="font-black text-xs">الحصة الحالية ({currentLiveLesson.dayName}):</span>

                                        <span className="text-[10px] bg-yellow-400 text-slate-900 px-2 py-0.5 rounded-full font-black">الحصة {currentLiveLesson.lessonNum}</span>
                                    </div>
                                    
                                    {currentLiveLesson.scheduledClass && currentLiveLesson.scheduledClass.subject ? (
                                        <div className="flex items-center justify-between pt-1">

                                                <h4 className="font-black text-sm text-yellow-300">مادة: {currentLiveLesson.scheduledClass.subject}</h4>
                                                <p className="text-[10px] text-slate-300 font-bold">شعبة ({currentLiveLesson.scheduledClass.section})</p>
                                            </div>
                                            <button onClick={jumpToLiveClass} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-black text-xs shadow flex items-center gap-1 active:scale-95 transition-all">دخول السجل 🚀</button>

                            {(view === 'dashboard' || view === 'list' || view === 'attendance') && (
                                <div className="bg-indigo-600 p-2.5 rounded-2xl shadow-md text-white">
                                    <div className="flex items-center justify-between mb-1.5 text-[10px] font-bold opacity-90">

                            {view === 'dashboard' && (

                                    <div className="grid grid-cols-2 gap-2 text-center text-xs">
                                        <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} p-3.5 rounded-2xl border shadow-sm border-r-4 border-r-indigo-500`}>
                                            <div className="text-lg font-black">{stats.total}</div>

        }

        // OFFICIAL PRINT PREVIEW STUDIO (Matching OfficialPrintPreviewScreen in SpeedGradingAndPrintScreen.kt 100%)
        function renderOfficialPrintStudioOverlay() {
            if (!state.isPrintModeOpen) return "";
            const pCfg = state.printConfig;
            const curDept = getCurrentDept();
            const curStage = getCurrentStage();
            const activeSub = state.globalSub || (curStage.subjects[0] || "---");
            const maxG = getMaxAllowedGrade();
            const failThr = getFailThreshold();

            const baseStudents = state.globalSec
                ? getStageStudents().filter(s => s.section === state.globalSec)
                : getStageStudents();

            let sortedStudents = [...baseStudents];
            if (pCfg.sortOrder === "top_score") {
                sortedStudents.sort((a, b) => {
                    const ra = calculateResults(state.grades[`${a.id}_${activeSub}`], maxG);
                    const rb = calculateResults(state.grades[`${b.id}_${activeSub}`], maxG);
                    const sa = ra.secondRoundResult !== null ? ra.secondRoundResult : (ra.hasFinalResult ? ra.finalResult : Math.min(maxG, ra.saei + ra.qarar));
                    const sb = rb.secondRoundResult !== null ? rb.secondRoundResult : (rb.hasFinalResult ? rb.finalResult : Math.min(maxG, rb.saei + rb.qarar));
                    return sb - sa;
                });
            } else if (pCfg.sortOrder === "passed_only") {
                sortedStudents = sortedStudents.filter(s => {
                    const r = calculateResults(state.grades[`${s.id}_${activeSub}`], maxG);
                    const sc = r.secondRoundResult !== null ? r.secondRoundResult : (r.hasFinalResult ? r.finalResult : Math.min(maxG, r.saei + r.qarar));
                    return r.hasSaei && sc >= failThr;
                });
            } else if (pCfg.sortOrder === "failed_only") {
                sortedStudents = sortedStudents.filter(s => {
                    const r = calculateResults(state.grades[`${s.id}_${activeSub}`], maxG);
                    const sc = r.secondRoundResult !== null ? r.secondRoundResult : (r.hasFinalResult ? r.finalResult : Math.min(maxG, r.saei + r.qarar));
                    return r.hasSaei && sc < failThr;
                });
            } else {
                sortedStudents.sort((a, b) => a.name.localeCompare(b.name, "ar"));
            }

            let reportTitle = "سجل درجات الطلاب السنوي الشامل";
            if (pCfg.templateType === "monthly") {
                const mLabels = { m1: "الفصل الأول - الشهر الأول", m2: "الفصل الأول - الشهر الثاني", m3: "الفصل الثاني - الشهر الأول", m4: "الفصل الثاني - الشهر الثاني" };
                reportTitle = `سجل المتابعة اليومي والشهري التفصيلي (${mLabels[pCfg.monthKey] || "المتابعة الشهرية"})`;
            } else if (pCfg.templateType === "attendance") {
                reportTitle = "سجل الحضور والغياب والإنذارات الوزاري الرسمي";
            } else if (pCfg.templateType === "blank_roster") {
                reportTitle = "سجل الرصد الورقي الفارغ (قائمة الدرجات والمتابعة الصفية)";
            }

            const stats = computeStageStats();
            const headerBg = pCfg.colorTheme ? "#EEF2FF" : "#F1F5F9";
            const borderCol = pCfg.colorTheme ? "#4F46E5" : "#000000";

            let tableHtml = "";
            if (pCfg.templateType === "monthly") {
                const mIdx = parseInt(pCfg.monthKey.replace("m", ""), 10) || 1;
                const startField = (mIdx - 1) * 3 + 1;
                const rows = sortedStudents.map((std, idx) => {
                    const g = state.grades[`${std.id}_${activeSub}`] || {};
                    const vD = g[`v${startField}`] ? parseInt(g[`v${startField}`], 10) : null;
                    const vP = g[`v${startField + 1}`] ? parseInt(g[`v${startField + 1}`], 10) : null;
                    const vW = g[`v${startField + 2}`] ? parseInt(g[`v${startField + 2}`], 10) : null;
                    const hasAny = vD !== null || vP !== null || vW !== null;
                    const sum = (vD || 0) + (vP || 0) + (vW || 0);
                    const hwMiss = state.missingHomework[`${std.id}_${activeSub}`] || 0;
                    const absCount = countStudentTotalAbsences(std.id);
                    let evalLabel = "-";
                    if (hasAny) {
                        if (sum >= Math.floor(maxG * 0.9)) evalLabel = "امتياز 🌟";
                        else if (sum >= Math.floor(maxG * 0.8)) evalLabel = "جيد جداً";
                        else if (sum >= Math.floor(maxG * 0.7)) evalLabel = "جيد";
                        else if (sum >= failThr) evalLabel = "متوسط";
                        else evalLabel = "ضعيف ⚠️";
                    }
                    const sumCol = (!pCfg.colorTheme || !hasAny) ? "#000" : (sum >= failThr ? "#047857" : "#E11D48");
                    return `
                    <tr style="background:${pCfg.colorTheme && idx % 2 === 1 ? '#F8FAFC' : '#FFF'};">
                        <td>${idx + 1}</td>
                        <td style="text-align:right;font-weight:900;">${escapeHtml(std.name)}</td>
                        <td>${escapeHtml(std.section)}</td>
                        <td>${vD !== null ? vD : '-'}</td>
                        <td>${vP !== null ? vP : '-'}</td>
                        <td>${vW !== null ? vW : '-'}</td>
                        <td style="font-weight:900;color:${sumCol};">${hasAny ? sum : '-'}</td>
                        <td style="color:${pCfg.colorTheme && hwMiss > 0 ? '#D97706' : '#000'};">${hwMiss > 0 ? `${hwMiss} نقص` : 'ملتزم ✓'}</td>
                        <td style="color:${pCfg.colorTheme && absCount > 0 ? '#E11D48' : '#000'};">${absCount > 0 ? `${absCount} يوم` : '0'}</td>
                        <td style="font-weight:900;color:${sumCol};">${evalLabel}</td>
                    </tr>`;
                }).join("");
                tableHtml = `
                <table style="width:100%;border-collapse:collapse;font-size:11px;text-align:center;border:2px solid ${borderCol};" border="1" cellpadding="5">
                    <thead style="background:${headerBg};font-weight:900;">
                        <tr>
                            <th>ت</th><th>اسم الطالب الرباعي</th><th>الشعبة</th><th>اليومي</th><th>العملي</th><th>التحريري</th><th>المجموع (${maxG})</th><th>الواجبات</th><th>الغيابات</th><th>التقدير</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
            } else if (pCfg.templateType === "attendance") {
                const rows = sortedStudents.map((std, idx) => {
                    const absCount = countStudentTotalAbsences(std.id);
                    const excCount = countStudentTotalStatus(std.id, "excused");
                    const presCount = countStudentTotalStatus(std.id, "present");
                    const todaySt = resolveEffectiveAttendanceStatus(std.id, state.attendanceDate, state.attendance, state.studentTags);
                    const todayLbl = todaySt === "absent" ? "غائب ❌" : (todaySt === "excused" ? "إجازة 🕒" : (todaySt === "intisab" ? "انتساب 🏠" : "حاضر ✅"));
                    const totTracked = Math.max(1, presCount + absCount + excCount);
                    const rate = Math.round(((presCount + excCount) * 100) / totTracked);
                    let warnText = "ملتزم تماماً ✅";
                    if (todaySt === "intisab") warnText = "طالب انتساب 🏠";
                    else if (absCount >= 21) warnText = "فصل بالغياب ⛔";
                    else if (absCount >= 7) warnText = `إنذار نهائي (${absCount}) ⛔`;
                    else if (absCount >= 5) warnText = `إنذار ثاني (${absCount}) 🚨`;
                    else if (absCount >= 3) warnText = `إنذار أول (${absCount}) ⚠️`;
                    else if (absCount >= 1) warnText = `تنبيه أولي (${absCount})`;
                    return `
                    <tr style="background:${pCfg.colorTheme && idx % 2 === 1 ? '#F8FAFC' : '#FFF'};">
                        <td>${idx + 1}</td>
                        <td style="text-align:right;font-weight:900;">${escapeHtml(std.name)}</td>
                        <td>${escapeHtml(std.section)}</td>
                        <td>${todayLbl}</td>
                        <td>${presCount}</td>
                        <td style="font-weight:900;color:${pCfg.colorTheme && absCount > 0 ? '#E11D48' : '#000'};">${absCount}</td>
                        <td>${excCount}</td>
                        <td>${rate}%</td>
                        <td style="font-weight:900;">${warnText}</td>
                        <td>${escapeHtml(std.phone || '-')}</td>
                    </tr>`;
                }).join("");
                tableHtml = `
                <table style="width:100%;border-collapse:collapse;font-size:11px;text-align:center;border:2px solid ${borderCol};" border="1" cellpadding="5">
                    <thead style="background:${headerBg};font-weight:900;">
                        <tr>
                            <th>ت</th><th>اسم الطالب</th><th>الشعبة</th><th>اليوم (${escapeHtml(state.attendanceDate)})</th><th>الحضور</th><th>الغياب</th><th>الإجازات</th><th>الالتزام</th><th>حالة الإنذار الوزاري</th><th>هاتف ولي الأمر</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
            } else if (pCfg.templateType === "blank_roster") {
                const cols = pCfg.blankColumnsCount || 8;
                let thCols = "";
                for (let c = 1; c <= cols; c++) thCols += `<th>حقل ${c}</th>`;
                const rows = sortedStudents.map((std, idx) => {
                    let tdCols = "";
                    for (let c = 1; c <= cols; c++) tdCols += `<td style="min-width:44px;">&nbsp;</td>`;
                    return `
                    <tr style="background:${pCfg.colorTheme && idx % 2 === 1 ? '#F8FAFC' : '#FFF'};">
                        <td>${idx + 1}</td>
                        <td style="text-align:right;font-weight:900;">${escapeHtml(std.name)}</td>
                        <td>${escapeHtml(std.section)}</td>
                        ${tdCols}
                        <td style="min-width:90px;">&nbsp;</td>
                    </tr>`;
                }).join("");
                tableHtml = `
                <table style="width:100%;border-collapse:collapse;font-size:11px;text-align:center;border:2px solid ${borderCol};" border="1" cellpadding="5">
                    <thead style="background:${headerBg};font-weight:900;">
                        <tr><th>ت</th><th>اسم الطالب</th><th>الشعبة</th>${thCols}<th>الملاحظات</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
            } else {
                // Default 14-Column Annual Ledger
                const rows = sortedStudents.map((std, idx) => {
                    const res = calculateResults(state.grades[`${std.id}_${activeSub}`], maxG);
                    const effSaei = Math.min(maxG, res.saei + res.qarar);
                    const finalScore = res.secondRoundResult !== null ? res.secondRoundResult : (res.hasFinalResult ? res.finalResult : effSaei);
                    const isPass = finalScore >= failThr;
                    const status = res.hasSaei ? (isPass ? "ناجح ✓" : "راسب") : "-";
                    const stCol = (!pCfg.colorTheme || !res.hasSaei) ? "#000" : (isPass ? "#047857" : "#E11D48");
                    return `
                    <tr style="background:${pCfg.colorTheme && idx % 2 === 1 ? '#F8FAFC' : '#FFF'};">
                        <td>${idx + 1}</td>
                        <td style="text-align:right;font-weight:900;">${escapeHtml(std.name)} (${escapeHtml(std.section)})</td>
                        <td>${res.hasM1 ? res.m1 : '-'}</td>
                        <td>${res.hasM2 ? res.m2 : '-'}</td>
                        <td style="font-weight:900;">${res.hasAvg1 ? res.avg1 : '-'}</td>
                        <td>${res.hasMid ? res.mid : '-'}</td>
                        <td>${res.hasM3 ? res.m3 : '-'}</td>
                        <td>${res.hasM4 ? res.m4 : '-'}</td>
                        <td style="font-weight:900;">${res.hasAvg2 ? res.avg2 : '-'}</td>
                        <td style="font-weight:900;color:${pCfg.colorTheme && res.isExempt ? '#4F46E5' : '#000'};">${res.isExempt ? '✨ معفي' : (res.hasSaei ? effSaei : '-')}</td>
                        <td>${res.hasFinal ? res.finalExam : '-'}</td>
                        <td style="color:${pCfg.colorTheme && res.qarar > 0 ? '#D97706' : '#000'};">${res.qarar > 0 ? `+${res.qarar}` : '-'}</td>
                        <td style="background:${pCfg.colorTheme ? '#FFFBEB' : 'transparent'};">${res.hasSecondRound ? res.secondRoundExam : '-'}</td>
                        <td style="font-weight:900;color:${stCol};">${status}</td>
                    </tr>`;
                }).join("");
                tableHtml = `
                <table style="width:100%;border-collapse:collapse;font-size:11px;text-align:center;border:2px solid ${borderCol};" border="1" cellpadding="4">
                    <thead style="background:${headerBg};font-weight:900;">
                        <tr>
                            <th>ت</th><th>اسم الطالب</th><th>ف1 ش1</th><th>ف1 ش2</th><th>معدل ف1</th><th>نصف السنة</th><th>ف2 ش1</th><th>ف2 ش2</th><th>معدل ف2</th><th>السعي السنوي</th><th>النهائي</th><th>قرار</th><th>دور ثان</th><th>النتيجة</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
            }

            return `
            <div class="fullscreen-overlay" style="background:#E2E8F0;color:#0F172A;">
                <!-- 1. Top Command & Export Header Bar -->
                <div style="background:#0F172A;color:#FFF;padding:10px 12px;display:flex;flex-direction:column;gap:8px;">
                    <div style="max-width:680px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#9333EA);display:flex;align-items:center;justify-content:center;font-size:18px;">🖨️</div>
                            <div>
                                <div style="font-size:13px;font-weight:900;">استوديو الطباعة والتقارير الرسمية</div>
                                <div style="font-size:10px;font-weight:800;color:#818CF8;">${escapeHtml(curDept.name)} • ${escapeHtml(curStage.name)} (${sortedStudents.length} طالب)</div>
                            </div>
                        </div>
                        <div style="display:flex;gap:6px;">
                            <button onclick="togglePrintPanelExpanded()" style="border-radius:10px;background:${pCfg.isPanelExpanded ? '#4F46E5' : '#1E293B'};border:1px solid rgba(129,140,248,0.4);color:#FFF;padding:7px 10px;font-size:11px;font-weight:900;">
                                ${pCfg.isPanelExpanded ? 'إخفاء الإعدادات ▲' : 'تخصيص السجل ⚙️'}
                            </button>
                            <button onclick="closeOfficialPrintMode()" style="border-radius:10px;background:#E11D48;color:#FFF;padding:7px 10px;font-size:11px;font-weight:900;">
                                إغلاق ✕
                            </button>
                        </div>
                    </div>
                    <div style="max-width:680px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;">
                        <button onclick="window.print()" style="height:40px;border-radius:12px;background:#4F46E5;color:#FFF;font-size:12px;font-weight:900;">🖨️ طباعة / حفظ PDF</button>
                        <button onclick="exportCurrentGradesExcel()" style="height:40px;border-radius:12px;background:#10B981;color:#FFF;font-size:12px;font-weight:900;">📊 تصدير Excel</button>
                        <button onclick="sharePrintSummaryWhatsApp()" style="height:40px;border-radius:12px;background:#0D9488;color:#FFF;font-size:12px;font-weight:900;">📤 مشاركة السجل</button>
                    </div>
                </div>

                <!-- 2. Interactive Print Studio Customization Panel -->
                ${pCfg.isPanelExpanded ? `
                <div style="background:#FFF;border-bottom:1px solid #CBD5E1;padding:10px 12px;">
                    <div style="max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px;">
                        <div style="font-size:11px;font-weight:900;color:#475569;">📑 اختر نوع القالب الرسمي:</div>
                        <div style="display:flex;gap:6px;overflow-x:auto;">
                            ${[
                                ["annual", "📊 السجل السنوي (14 عموداً)"],
                                ["monthly", "📝 سجل المتابعة الشهري"],
                                ["attendance", "📅 سجل الغياب والإنذارات"],
                                ["blank_roster", "🗒️ سجل ورقي فارغ للرصد"]
                            ].map(([k, lbl]) => `
                                <button onclick="setPrintTemplate('${k}')" style="border-radius:10px;padding:6px 10px;font-size:11px;font-weight:900;white-space:nowrap;background:${pCfg.templateType === k ? '#4F46E5' : '#F1F5F9'};color:${pCfg.templateType === k ? '#FFF' : '#0F172A'};border:1px solid ${pCfg.templateType === k ? '#4F46E5' : '#CBD5E1'};">${lbl}</button>
                            `).join("")}
                        </div>

                        ${pCfg.templateType === "monthly" ? `
                            <div style="display:flex;align-items:center;gap:6px;overflow-x:auto;">

                            <button onclick="togglePrintColorTheme()" style="border-radius:8px;padding:5px 8px;font-size:11px;font-weight:900;white-space:nowrap;background:${pCfg.colorTheme ? '#EEF2FF' : '#E2E8F0'};border:1px solid ${pCfg.colorTheme ? '#818CF8' : '#94A3B8'};color:${pCfg.colorTheme ? '#4F46E5' : '#0F172A'};">

            const gKey = `${studentId}_${subject}`;
            state.grades[gKey] = state.grades[gKey] || {};
            const g = state.grades[gKey];
            if (!g[`orig_${monthField}`] && g[monthField]) {
                g[`orig_${monthField}`] = g[monthField];
            }
            const cur = parseInt(g[monthField] || "0", 10) || 0;
            const maxG = getMaxAllowedGrade();
            g[monthField] = String(Math.min(maxG, cur + pts));
            saveDatabase();
            closeModal();
            showToast(`⭐ تمت إضافة (+${pts}) درجة تشجيعية بنجاح`);

        // ============================================================
        // PART 8: SPEED KEYPAD, ATTENDANCE, SCHEDULE, WHATSAPP & INIT
        // ============================================================
        function openSpeedGradingMode() {
            state.isSpeedModeOpen = true;
            state.speedConfig.activeIdx = 0;
            state.speedConfig.activeTab = "m1";
            state.speedConfig.activeSubFieldIdx = 0;
            state.speedConfig.isFreshField = true;
            renderApp();
        }

        function closeSpeedGradingMode() {
            state.isSpeedModeOpen = false;
            renderApp();
        }

        function finishSpeedGrading() {
            state.isSpeedModeOpen = false;
            saveDatabase();
            renderApp();
            showToast("✅ تم حفظ وإنهاء الرصد السريع بنجاح");
        }

        function updateSpeedConfig(newIdx, newTab, newSubFieldIdx) {
            if (newIdx !== null && newIdx !== undefined) state.speedConfig.activeIdx = newIdx;
            if (newTab !== null && newTab !== undefined) state.speedConfig.activeTab = newTab;
            if (newSubFieldIdx !== null && newSubFieldIdx !== undefined) state.speedConfig.activeSubFieldIdx = newSubFieldIdx;
            state.speedConfig.isFreshField = true;
            renderApp();
        }

        function toggleSpeedAutoAdvance() {
            state.speedConfig.autoAdvance = !state.speedConfig.autoAdvance;
            renderApp();
        }

        function getCurrentSpeedFieldName() {
            const activeTab = state.speedConfig.activeTab || "m1";
            const maxG = getMaxAllowedGrade();
            const isMonthly = activeTab.startsWith("m") && activeTab !== "mid" && maxG !== 10;
            const mIdx = parseInt(activeTab.replace("m", ""), 10) || 1;
            const startNum = (mIdx - 1) * 3 + 1;
            if (isMonthly) return `v${startNum + state.speedConfig.activeSubFieldIdx}`;
            if (activeTab.startsWith("m") && activeTab !== "mid") return `v${startNum}`;
            return activeTab;
        }

        function setGradeFieldVerified(studentId, fieldName, valStr) {
            const activeSub = state.globalSub || (getCurrentStage().subjects[0] || "عام");
            const gKey = `${studentId}_${activeSub}`;
            state.grades[gKey] = state.grades[gKey] || {};
            const g = state.grades[gKey];
            const maxG = getMaxAllowedGrade();

            if (valStr === "") {
                g[fieldName] = "";
                saveDatabase();
                return true;
            }
            const num = parseInt(valStr, 10);
            if (isNaN(num) || num < 0 || num > maxG) {
                showToast(`⚠️ الدرجة يجب أن لا تتجاوز (${maxG})`);
                return false;
            }
            if (maxG !== 10 && fieldName.startsWith("v")) {
                const fNum = parseInt(fieldName.replace("v", ""), 10);
                const mStart = Math.floor((fNum - 1) / 3) * 3 + 1;
                let otherSum = 0;
                for (let k = mStart; k <= mStart + 2; k++) {
                    if (`v${k}` !== fieldName) otherSum += (parseInt(g[`v${k}`] || "0", 10) || 0);
                }
                if (otherSum + num > maxG) {
                    showToast(`⚠️ مجموع الشهر لا يمكن أن يتجاوز (${maxG})`);
                    return false;
                }
            }
            g[fieldName] = String(num);
            saveDatabase();
            return true;
        }

        function handleSpeedKeypadDigit(digitStr) {
            const speedList = getSpeedStudentsList();
            const std = speedList[state.speedConfig.activeIdx];
            if (!std) return;
            const activeSub = state.globalSub || (getCurrentStage().subjects[0] || "عام");
            const g = state.grades[`${std.id}_${activeSub}`] || {};
            const fieldName = getCurrentSpeedFieldName();
            const curVal = (g[fieldName] || "").toString();
            const base = state.speedConfig.isFreshField ? "" : curVal;
            const candidate = base === "0" ? digitStr : (base + digitStr);
            const num = parseInt(candidate, 10);
            if (isNaN(num)) return;

            if (setGradeFieldVerified(std.id, fieldName, String(num))) {
                state.speedConfig.isFreshField = false;
                const maxG = getMaxAllowedGrade();
                if (state.speedConfig.autoAdvance) {
                    const shouldAdv = maxG === 10
                        ? (num >= 2 || num === 0 || candidate.length >= 2)
                        : (candidate.length >= 2 && num * 10 > maxG);
                    if (shouldAdv) {
                        advanceSpeedField();
                        return;
                    }
                }
                renderApp();
            }
        }

        function handleSpeedQuickTen() {
            const speedList = getSpeedStudentsList();
            const std = speedList[state.speedConfig.activeIdx];
            if (!std) return;
            const fieldName = getCurrentSpeedFieldName();
            if (setGradeFieldVerified(std.id, fieldName, "10")) {
                state.speedConfig.isFreshField = true;
                if (state.speedConfig.autoAdvance) advanceSpeedField();
                else renderApp();
            }
        }

        function handleSpeedBackspace() {
            const speedList = getSpeedStudentsList();
            const std = speedList[state.speedConfig.activeIdx];
            if (!std) return;
            const activeSub = state.globalSub || (getCurrentStage().subjects[0] || "عام");
            const g = state.grades[`${std.id}_${activeSub}`] || {};
            const fieldName = getCurrentSpeedFieldName();
            const curVal = (g[fieldName] || "").toString();
            if (curVal.length > 0) {
                setGradeFieldVerified(std.id, fieldName, curVal.slice(0, -1));
                state.speedConfig.isFreshField = false;
                renderApp();
            }
        }

        function handleSpeedClearField() {
            const speedList = getSpeedStudentsList();
            const std = speedList[state.speedConfig.activeIdx];
            if (!std) return;
            const fieldName = getCurrentSpeedFieldName();
            setGradeFieldVerified(std.id, fieldName, "");
            state.speedConfig.isFreshField = true;
            renderApp();
        }

        function advanceSpeedField() {
            const speedList = getSpeedStudentsList();
            const activeTab = state.speedConfig.activeTab || "m1";
            const maxG = getMaxAllowedGrade();
            const isMonthly = activeTab.startsWith("m") && activeTab !== "mid" && maxG !== 10;
            state.speedConfig.isFreshField = true;

            if (isMonthly && state.speedConfig.activeSubFieldIdx < 2) {
                state.speedConfig.activeSubFieldIdx++;
                renderApp();
            } else {
                state.speedConfig.activeSubFieldIdx = 0;
                if (state.speedConfig.activeIdx < speedList.length - 1) {
                    state.speedConfig.activeIdx++;
                    renderApp();
                } else {
                    showToast("🎉 وصلت إلى آخر طالب في القائمة!");
                    renderApp();
                }
            }
        }

        function openVoiceGradingPrompt() {
            const speedList = getSpeedStudentsList();
            const std = speedList[state.speedConfig.activeIdx];
            if (!std) return;
            const spoken = prompt(`🎙️ الرصد الصوتي والذكي للطالب (${std.name}):\nأدخل الدرجة (أو 3 درجات معاً لليومي والعملي والتحريري مفصولة بمسافة مثل: 15 18 55):`);
            if (!spoken) return;
            const nums = (spoken.match(/\d+/g) || []).map(x => parseInt(x, 10));
            if (!nums.length) return;
            const activeTab = state.speedConfig.activeTab || "m1";
            const maxG = getMaxAllowedGrade();
            const isMonthly = activeTab.startsWith("m") && activeTab !== "mid" && maxG !== 10;
            const mIdx = parseInt(activeTab.replace("m", ""), 10) || 1;
            const startNum = (mIdx - 1) * 3 + 1;

        function exportCurrentGradesExcel() {
            const curDept = getCurrentDept();
            const curStage = getCurrentStage();
            const activeSub = state.globalSub || (curStage.subjects[0] || "عام");
            const maxG = getMaxAllowedGrade();
            const failThr = getFailThreshold();
            const list = getFilteredStudents();

            let csv = "\uFEFFت,اسم الطالب,الشعبة,ف1 ش1,ف1 ش2,معدل ف1,نصف السنة,ف2 ش1,ف2 ش2,معدل ف2,السعي السنوي,الامتحان النهائي,درجة القرار,الدور الثاني,النتيجة\n";
            list.forEach((std, idx) => {
                const res = calculateResults(state.grades[`${std.id}_${activeSub}`], maxG);
                const effSaei = Math.min(maxG, res.saei + res.qarar);
                const finalScore = res.secondRoundResult !== null ? res.secondRoundResult : (res.hasFinalResult ? res.finalResult : effSaei);
                const status = res.hasSaei ? (finalScore >= failThr ? "ناجح" : "راسب") : "-";
                csv += `${idx + 1},"${std.name}","${std.section}",${res.hasM1 ? res.m1 : ""},${res.hasM2 ? res.m2 : ""},${res.hasAvg1 ? res.avg1 : ""},${res.hasMid ? res.mid : ""},${res.hasM3 ? res.m3 : ""},${res.hasM4 ? res.m4 : ""},${res.hasAvg2 ? res.avg2 : ""},${res.hasSaei ? effSaei : ""},${res.hasFinal ? res.finalExam : ""},${res.qarar || ""},${res.hasSecondRound ? res.secondRoundExam : ""},"${status}"\n`;
            });
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `سجل_${curStage.name}_${activeSub}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("📊 تم تصدير ملف Excel (CSV) بنجاح");
        }

        }
        function requestActivationViaWhatsApp() {
            const msg = `مرحباً أستاذ وعد، أرغب بالحصول على كود تفعيل تطبيق (بوصلة الأستاذ v${APP_VERSION_NAME}) لنسخة الآيفون.\nالمدرس: ${state.settings.teacherName}\nالمدرسة: ${state.settings.schoolName}`;
            window.open(`https://wa.me/9647824982909?text=${encodeURIComponent(msg)}`, "_blank");
        }

        // Smart Import (PDF / Text / Image)
        function triggerSmartImportFile() {
            document.getElementById("smart-import-file-input")?.click();
        }
        function triggerSmartCameraImport() {
            document.getElementById("smart-camera-input")?.click();
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadDatabase();
            renderApp();

            const restoreInp = document.getElementById("restore-file-input");
            if (restoreInp) {
                restoreInp.addEventListener("change", (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const parsed = JSON.parse(ev.target.result);
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
                            loadDatabase();
                            renderApp();
                            showToast("✅ تم استرجاع النسخة الاحتياطية بنجاح");
                        } catch (_) {
                            showToast("❌ ملف النسخة الاحتياطية غير صالح");
                        }
                    };
                    reader.readAsText(file);
                    restoreInp.value = "";
                });
            }

            const handleSmartFile = (file) => {
                if (!file) return;
                if (file.type.startsWith("image/")) {
                    showToast("📷 يرجى لصق الأسماء أو كتابتها في مربع الإدخال الجماعي");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const txt = String(ev.target.result || "");
                    state.bulkText = (state.bulkText ? state.bulkText + "\n" : "") + txt;
                    renderApp();
                    showToast("📄 تم استيراد النص إلى قائمة الإدخال الجماعي");
                };
                reader.readAsText(file);
            };

            document.getElementById("smart-import-file-input")?.addEventListener("change", (e) => {
                handleSmartFile(e.target.files && e.target.files[0]);
                e.target.value = "";
            });
            document.getElementById("smart-camera-input")?.addEventListener("change", (e) => {
                handleSmartFile(e.target.files && e.target.files[0]);
                e.target.value = "";
            });

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بوصلة الأستاذ v4.4</title>
    <!-- iOS & Safari PWA Fullscreen Standalone Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="بوصلة الأستاذ">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E1B4B">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F1F5F9;
            --bg-card: #FFFFFF;
            --bg-sub: #F8FAFC;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border-color: #E2E8F0;
            --indigo-400: #818CF8;
            --indigo-500: #6366F1;
            --indigo-600: #4F46E5;
            --indigo-900: #312E81;
            --indigo-950: #1E1B4B;
            --purple-500: #A855F7;
            --purple-600: #9333EA;
            --purple-900: #581C87;
            --emerald-400: #34D399;
            --emerald-500: #10B981;
            --emerald-600: #059669;
            --amber-400: #FBBF24;
            --amber-500: #F59E0B;
            --amber-600: #D97706;
            --rose-500: #F43F5E;
            --rose-600: #E11D48;
            --blue-500: #3B82F6;
            --sky-500: #0284C7;
            --violet-500: #7C3AED;
            --intisab-purple: #8B5CF6;
            --shadow-card: 0 4px 14px rgba(15, 23, 42, 0.06);
        }
        body.dark-mode {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --bg-sub: #0F172A;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --border-color: #334155;
            --sky-500: #38BDF8;
            --violet-500: #A78BFA;
            --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.35);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(96px + env(safe-area-inset-bottom, 14px));
            overflow-x: hidden;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }
        input, textarea, select {
            user-select: text;
            font-family: 'Cairo', sans-serif;
        }
        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: 'Cairo', sans-serif;
            transition: transform 0.12s ease, opacity 0.15s ease;
        }
        button:active {
            transform: scale(0.96);
        }
        .app-shell {
            max-width: 540px;
            margin: 0 auto;
        }

        /* 1. WaadHeaderBar */
        .waad-header {
            position: sticky;
            top: 0;
            z-index: 90;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            padding: 8px 12px;
        }
        .waad-header-inner {
            max-width: 540px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }
        .logo-badge {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4F46E5, #9333EA);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(79, 70, 229, 0.3);
        }
        .brand-titles {
            min-width: 0;
            flex: 1;
        }
        .brand-title-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .brand-name {
            font-size: 14px;
            font-weight: 900;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .version-pill {
            font-size: 10px;
            font-weight: 900;
            color: #10B981;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.45);
            border-radius: 6px;
            padding: 1px 5px;
            line-height: 1.3;
        }
        .teacher-subtitle {
            font-size: 11px;
            font-weight: 800;
            color: var(--indigo-600);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            display: block;
        }
        body.dark-mode .teacher-subtitle {
            color: var(--indigo-400);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .hdr-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            border: 1px solid var(--border-color);
            background: var(--bg-sub);
            color: var(--text-primary);
            position: relative;
        }
        .hdr-icon-btn.active-school {
            background: linear-gradient(135deg, #4F46E5, #9333EA);
            color: #FFF;
            border-color: transparent;
        }
        .hdr-icon-btn.active-app {
            background: var(--indigo-600);
            color: #FFF;
            border-color: transparent;
        }
        .unsaved-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--amber-500);
        }
        .trial-pill {
            height: 34px;
            padding: 0 9px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            white-space: nowrap;
            background: rgba(245, 158, 11, 0.14);
            color: #D97706;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }
        body.dark-mode .trial-pill {
            color: #FBBF24;
        }
        .trial-pill.pro {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* 2. Floating Liquid Capsule Bottom Nav (WaadBottomNav) */
        .bottom-nav-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 95;
            padding: 0 12px calc(10px + env(safe-area-inset-bottom, 6px));
            pointer-events: none;
        }
        .bottom-nav-capsule {
            max-width: 500px;
            margin: 0 auto;
            height: 68px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.22);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            pointer-events: auto;
        }
        body.dark-mode .bottom-nav-capsule {
            background: rgba(15, 23, 42, 0.95);
            border-color: rgba(129, 140, 248, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
        }
        .nav-tab {
            flex: 1;
            height: 54px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            position: relative;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
        }
        .nav-tab .nav-beam {
            position: absolute;
            top: 3px;
            width: 22px;
            height: 3px;
            border-radius: 4px;
            background: transparent;
            transition: all 0.2s;
        }
        .nav-tab .nav-icon {
            font-size: 18px;
            line-height: 1;
            transition: transform 0.2s;
        }
        .nav-tab.active {
            font-weight: 900;
        }
        .nav-tab.active .nav-icon {
            transform: translateY(-1px) scale(1.08);
        }
        .nav-tab[data-tab="dashboard"].active {
            background: rgba(99, 102, 241, 0.14);
            color: #6366F1;
        }
        .nav-tab[data-tab="dashboard"].active .nav-beam { background: #6366F1; }
        .nav-tab[data-tab="list"].active {
            background: rgba(168, 85, 247, 0.14);
            color: #A855F7;
        }
        .nav-tab[data-tab="list"].active .nav-beam { background: #A855F7; }
        .nav-tab[data-tab="attendance"].active {
            background: rgba(16, 185, 129, 0.14);
            color: #10B981;
        }
        .nav-tab[data-tab="attendance"].active .nav-beam { background: #10B981; }
        .nav-tab[data-tab="schedule"].active {
            background: rgba(245, 158, 11, 0.14);
            color: #F59E0B;
        }
        .nav-tab[data-tab="schedule"].active .nav-beam { background: #F59E0B; }

        .center-fab-slot {
            width: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-fab-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4F46E5, #9333EA);
            color: #FFF;
            font-size: 26px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.45);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
        }
        .center-fab-btn.active {
            background: linear-gradient(135deg, #F43F5E, #E11D48);
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.45);
            transform: rotate(135deg);
        }

        /* 3. Main Content & Cards */
        .page-container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 14px;
            box-shadow: var(--shadow-card);
        }

        /* 4. ScopeSelectorBanner */
        .scope-banner {
            border-radius: 22px;
            background: linear-gradient(135deg, #3730A3, #4F46E5, #6D28D9);
            border: 1px solid rgba(129, 140, 248, 0.4);
            padding: 12px 14px;
            color: #FFF;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.25);
        }
        .scope-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .scope-title-grp {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 900;
            color: #E0E7FF;
        }
        .scope-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FBBF24;
        }
        .scope-count-pill {
            background: rgba(255,255,255,0.16);
            border-radius: 8px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 900;
            color: #FDE047;
        }
        .scope-selects-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .scope-select-wrap {
            position: relative;
        }
        .scope-select {
            width: 100%;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #FFF;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 900;
            appearance: none;
            -webkit-appearance: none;
        }
        .scope-select option {
            color: #0F172A;
            background: #FFF;
        }

        /* 5. Live Lesson Card */
        .live-lesson-card {
            border-radius: 24px;
            background: linear-gradient(135deg, #312E81, #581C87);
            border: 1px solid rgba(129, 140, 248, 0.35);
            padding: 15px;
            color: #FFF;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .live-pulse-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }

        /* 6. Stat Cards 2x2 */
        .stats-grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card-m3 {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
        }
        .stat-right {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .stat-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .stat-val {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.1;
        }
        .stat-lbl {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-bar-left {
            width: 4px;
            height: 34px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* 7. Action Gradient Cards */
        .action-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grad-action-btn {
            height: 54px;
            border-radius: 20px;
            padding: 0 14px;
            color: #FFF;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        }

        /* 8. Standard Inputs & Dropdowns */
        .field-input, .field-select, .field-textarea {
            width: 100%;
            border-radius: 14px;
            background: var(--bg-sub);
            border: 1.2px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 800;
            outline: none;
            transition: border-color 0.15s;
        }
        .field-input:focus, .field-select:focus, .field-textarea:focus {
            border-color: var(--indigo-500);
        }

        /* 9. Student Card Row */
        .student-row-card {
            background: var(--bg-card);
            border: 1.2px solid var(--border-color);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: all 0.15s;
        }
        .student-row-card.selected-del {
            border-color: var(--rose-500);
            background: rgba(244, 63, 94, 0.08);
        }
        .std-idx-box {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.35);
            color: var(--indigo-600);
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }
        body.dark-mode .std-idx-box { color: var(--indigo-400); }
        .std-idx-box.checked {
            background: var(--rose-600);
            border-color: var(--rose-500);
            color: #FFF;
        }
        .std-mini-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .std-act-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* 10. Full-Screen Overlays (Speed Grading & Official Print Preview) */
        .fullscreen-overlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            overflow-y: auto;
        }

        /* 11. Modals */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(15, 23, 42, 0.68);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .modal-sheet {
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: modalPop 0.18s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.94); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-top-bar {
            height: 8px;
            width: 100%;
            flex-shrink: 0;
        }
        .modal-body {
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 12. Toast Banner */
        .waad-toast {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            background: #0F172A;
            color: #FFF;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        /* 13. Print Media Styles */
        @media print {
            body * { visibility: hidden; }
            #printable-a4-sheet, #printable-a4-sheet * {
                visibility: visible;
            }
            #printable-a4-sheet {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none !important;
                border: none !important;
                background: #FFF !important;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div id="pin-lock-root"></div>
    <div class="app-shell" id="app-root"></div>
    <div id="overlay-root"></div>
    <div id="modal-root"></div>
    <input type="file" id="restore-file-input" accept=".json" style="display:none" />
    <input type="file" id="smart-import-file-input" accept=".txt,.csv,.json,.pdf,image/*" style="display:none" />
    <input type="file" id="smart-camera-input" accept="image/*" capture="environment" style="display:none" />
    <script>
        // ============================================================
        // PART 2: DATA MODEL, IRAQI MINISTRY CALCULATOR & STATE ENGINE
        // ============================================================
        const APP_VERSION_NAME = "4.4";
        const APP_VERSION_CODE = 17;
        const STORAGE_KEY = "waad_compass_v44_ios_db";
        const WEEK_DAYS = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
        const BEHAVIOR_TAGS = [
            "🌟 متميز", "🙋‍♂️ مشارك متفاعل", "🤫 هادئ ومؤدب",
            "📉 يحتاج متابعة", "🗣️ كثير الكلام", "📚 نسيان الكتاب/الدفتر", "⚠️ سلوك غير منضبط"
        ];
        const INTISAB_TAG = "🏠 طالب انتساب";

        function getLessonOrdinalName(num) {
            return {
                1: "الحصة الأولى", 2: "الحصة الثانية", 3: "الحصة الثالثة",
                4: "الحصة الرابعة", 5: "الحصة الخامسة", 6: "الحصة السادسة"
            }[num] || ("الحصة " + num);
        }

        function getDefaultLessonTimes(num) {
            return {
                1: ["08:00", "08:45"], 2: ["08:50", "09:35"], 3: ["09:40", "10:25"],
                4: ["10:40", "11:25"], 5: ["11:30", "12:15"], 6: ["12:20", "13:05"]
            }[num] || ["08:00", "08:45"];
        }

        function resolveLessonTimes(num, slot) {
            const def = getDefaultLessonTimes(num);
            if (!slot) return def;
            return [
                (slot.startTime && slot.startTime.trim()) ? slot.startTime.trim() : def[0],
                (slot.endTime && slot.endTime.trim()) ? slot.endTime.trim() : def[1]
            ];
        }

        function parseTimeToMinutes(hhmm) {
            if (!hhmm) return null;
            const p = hhmm.trim().split(":");
            if (p.length !== 2) return null;
            const h = parseInt(p[0], 10), m = parseInt(p[1], 10);
            if (isNaN(h) || isNaN(m)) return null;
            return h * 60 + m;
        }

        function calculateBreakMinutes(prevEnd, nextStart) {
            const e = parseTimeToMinutes(prevEnd), s = parseTimeToMinutes(nextStart);
            if (e === null || s === null) return 0;
            return Math.max(0, s - e);
        }

        function calculateDayTotalBreakMinutes(day, schedule) {
            let tot = 0;
            for (let l = 1; l <= 5; l++) {
                const [, end1] = resolveLessonTimes(l, schedule[day + "_" + l]);
                const [start2] = resolveLessonTimes(l + 1, schedule[day + "_" + (l + 1)]);
                tot += calculateBreakMinutes(end1, start2);
            }
            return tot;
        }

        // Exact Iraqi Ministry Calculator (WaadCalculator.calculateResults)
        function calculateResults(g, maxAllowedGrade = 100) {
            g = g || {};
            const p = (k) => {
                const v = (g[k] || "").toString().trim();
                if (!v) return null;
                const n = parseInt(v, 10);
                return isNaN(n) ? null : n;
            };
            const hasField = (k) => p(k) !== null;
            const sum3 = (a, b, c) => (p(a) || 0) + (p(b) || 0) + (p(c) || 0);

            if (maxAllowedGrade === 10) {
                const hasM1 = hasField("v1"), m1 = p("v1") || 0;
                const hasM2 = hasField("v4"), m2 = p("v4") || 0;
                const hasAvg1 = hasM1 && hasM2, avg1 = hasAvg1 ? Math.round((m1 + m2) / 2) : 0;
                const hasMid = hasField("mid"), mid = p("mid") || 0;
                const hasM3 = hasField("v7"), m3 = p("v7") || 0;
                const hasM4 = hasField("v10"), m4 = p("v10") || 0;
                const hasAvg2 = hasM3 && hasM4, avg2 = hasAvg2 ? Math.round((m3 + m4) / 2) : 0;
                const hasSaei = hasAvg1 && hasMid && hasAvg2;
                const saei = hasSaei ? Math.round((avg1 + mid + avg2) / 3) : 0;
                const hasFinal = hasField("final"), finalExam = p("final") || 0;
                const qarar = p("qarar") || 0;
                const effectiveSaei = Math.min(10, saei + qarar);
                const hasFinalResult = hasSaei && hasFinal;
                const finalResult = hasFinalResult ? Math.min(10, Math.round((saei + finalExam) / 2) + qarar) : effectiveSaei;
                const hasSecondRound = hasField("secondRound"), secondRoundExam = p("secondRound") || 0;
                const secondRoundResult = hasSecondRound ? Math.min(10, Math.round((saei + secondRoundExam) / 2) + qarar) : null;
                return {
                    m1, hasM1, m2, hasM2, avg1, hasAvg1, mid, hasMid,
                    m3, hasM3, m4, hasM4, avg2, hasAvg2,
                    saei, hasSaei, isExempt: false,
                    finalExam, hasFinal, qarar, finalResult, hasFinalResult,
                    secondRoundExam, hasSecondRound, secondRoundResult
                };
            }

            const hasM1 = hasField("v1") || hasField("v2") || hasField("v3"), m1 = hasM1 ? sum3("v1","v2","v3") : 0;
            const hasM2 = hasField("v4") || hasField("v5") || hasField("v6"), m2 = hasM2 ? sum3("v4","v5","v6") : 0;
            const hasAvg1 = hasM1 && hasM2, avg1 = hasAvg1 ? Math.round((m1 + m2) / 2) : 0;
            const hasMid = hasField("mid"), mid = p("mid") || 0;
            const hasM3 = hasField("v7") || hasField("v8") || hasField("v9"), m3 = hasM3 ? sum3("v7","v8","v9") : 0;
            const hasM4 = hasField("v10") || hasField("v11") || hasField("v12"), m4 = hasM4 ? sum3("v10","v11","v12") : 0;
            const hasAvg2 = hasM3 && hasM4, avg2 = hasAvg2 ? Math.round((m3 + m4) / 2) : 0;
            const hasSaei = hasAvg1 && hasMid && hasAvg2;
            const saei = hasSaei ? Math.round((avg1 + mid + avg2) / 3) : 0;
            const isExempt = hasSaei && saei >= 90;
            const hasFinal = hasField("final"), finalExam = p("final") || 0;
            const qarar = p("qarar") || 0;
            const effectiveSaei = Math.min(100, saei + qarar);
            const hasFinalResult = isExempt || (hasSaei && hasFinal);
            const finalResult = isExempt ? saei : (hasFinalResult ? Math.min(100, Math.round((saei + finalExam) / 2) + qarar) : effectiveSaei);
            const hasSecondRound = hasField("secondRound"), secondRoundExam = p("secondRound") || 0;
            const secondRoundResult = hasSecondRound ? Math.min(100, Math.round((saei + secondRoundExam) / 2) + qarar) : null;
            return {
                m1, hasM1, m2, hasM2, avg1, hasAvg1, mid, hasMid,
                m3, hasM3, m4, hasM4, avg2, hasAvg2,
                saei, hasSaei, isExempt,
                finalExam, hasFinal, qarar, finalResult, hasFinalResult,
                secondRoundExam, hasSecondRound, secondRoundResult
            };
        }

        function getFilteredStudents() {
            let list = getStageStudents();
            if (state.globalSec) {
                list = list.filter(s => s.section === state.globalSec);
            }
            const q = (state.searchQuery || "").trim().toLowerCase();
            if (q) {
                list = list.filter(s => s.name.toLowerCase().includes(q));
            }
            const activeSub = state.globalSub || (getCurrentStage().subjects[0] || "");
            const failThr = getFailThreshold();
            const maxG = getMaxAllowedGrade();

            if (state.sortMode === "grade_desc") {
                list = [...list].sort((a, b) => {
                    const ra = calculateResults(state.grades[`${a.id}_${activeSub}`], maxG).saei;
                    const rb = calculateResults(state.grades[`${b.id}_${activeSub}`], maxG).saei;
                    return rb - ra;
                });
            } else if (state.sortMode === "grade_asc") {
                list = [...list].sort((a, b) => {
                    const ra = calculateResults(state.grades[`${a.id}_${activeSub}`], maxG).saei;
                    const rb = calculateResults(state.grades[`${b.id}_${activeSub}`], maxG).saei;
                    return ra - rb;
                });
            } else if (state.sortMode === "failed_only") {
                list = list.filter(s => {
                    const res = calculateResults(state.grades[`${s.id}_${activeSub}`], maxG);
                    const eff = Math.min(maxG, res.saei + res.qarar);
                    const score = res.secondRoundResult !== null ? res.secondRoundResult : (res.hasFinalResult ? res.finalResult : eff);
                    return res.hasSaei && score < failThr;
                });
            } else {
                list = [...list].sort((a, b) => a.name.localeCompare(b.name, "ar"));
            }
            return list;
        }

        function computeStageStats() {
            const list = state.globalSec ? getStageStudents().filter(s => s.section === state.globalSec) : getStageStudents();
            const sub = state.globalSub || (getCurrentStage().subjects[0] || "");
            const maxG = getMaxAllowedGrade();
            const failThr = getFailThreshold();
            let activeCount = 0, passed = 0, failed = 0;

            list.forEach(s => {
                const g = state.grades[`${s.id}_${sub}`];
                const res = calculateResults(g, maxG);
                if (res.hasSaei || res.hasM1 || res.hasM2 || res.hasMid || res.hasM3 || res.hasM4) {
                    activeCount++;
                    const effSaei = Math.min(maxG, res.saei + res.qarar);
                    const score = res.secondRoundResult !== null ? res.secondRoundResult : (res.hasFinalResult ? res.finalResult : (res.hasSaei ? effSaei : (res.hasAvg1 ? res.avg1 : res.m1)));
                    if (score >= failThr) passed++;
                    else failed++;
                }
            });
            const rate = activeCount > 0 ? Math.round((passed * 100) / activeCount) : 0;
            return {
                total: list.length,
                activeCount,
                passed,
                failed,
                rate,
                labelText: sub ? `نسبة النجاح (${sub})` : "نسبة النجاح (السعي)"
            };
        }

        function detectCurrentLiveLesson() {
            const now = new Date();
            const jsDay = now.getDay(); // 0=Sun..6=Sat
            const dayMap = { 0: "الأحد", 1: "الإثنين", 2: "الثلاثاء", 3: "الأربعاء", 4: "الخميس", 5: "الجمعة", 6: "السبت" };
            const dayName = dayMap[jsDay] || "الأحد";
            const curMins = now.getHours() * 60 + now.getMinutes();

            let matchedLesson = 1;
            let isLiveWindow = false;
            for (let l = 1; l <= 6; l++) {
                const slot = state.teacherSchedule[`${dayName}_${l}`];
                const [st, et] = resolveLessonTimes(l, slot);
                const sm = parseTimeToMinutes(st) || 480;
                const em = parseTimeToMinutes(et) || 525;
                if (curMins >= sm && curMins <= em) {
                    matchedLesson = l;
                    isLiveWindow = true;
                    break;
                } else if (curMins < sm) {
                    matchedLesson = l;
                    break;
                }
            }
            const slotKey = `${dayName}_${matchedLesson}`;
            const scheduledClass = state.teacherSchedule[slotKey] || null;
            const [startTime, endTime] = resolveLessonTimes(matchedLesson, scheduledClass);
            return {
                dayName,
                lessonNum: matchedLesson,
                lessonOrdinalName: getLessonOrdinalName(matchedLesson),
                startTime,
                endTime,
                isLiveTimeWindow: isLiveWindow,
                scheduledClass
            };
        }

        // ============================================================
        // PART 4: ATTENDANCE SCREEN, SMART SCHEDULE & SETTINGS SCREENS
        // ============================================================
        function getLast7DaysList() {
            const daysAr = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
            const out = [];
            for (let offset = 0; offset <= 6; offset++) {
                const d = new Date();
                d.setDate(d.getDate() - offset);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, "0");
                const day = String(d.getDate()).padStart(2, "0");
                const dateStr = `${y}-${m}-${day}`;
                const shortDate = `${m}/${day}`;
                const dayNameAr = offset === 0 ? "اليوم" : (offset === 1 ? "أمس" : daysAr[d.getDay()]);
                out.push({ dateStr, shortDate, dayNameAr, isToday: offset === 0 });
            }
            return out;
        }

        function countStudentTotalAbsences(studentId) {
            if (isStudentIntisab(studentId, state.studentTags)) return 0;
            const prefix = `${studentId}_`;
            let c = 0;
            for (const k in state.attendance) {
                if (k.startsWith(prefix) && state.attendance[k] === "absent") c++;
            }
            return c;
        }

        function countStudentTotalStatus(studentId, targetSt) {
            const prefix = `${studentId}_`;
            let c = 0;
            for (const k in state.attendance) {
                if (k.startsWith(prefix) && state.attendance[k] === targetSt) c++;
            }
            return c;
        }

        // 4. ATTENDANCE SCREEN (Matching AttendanceScreen in AttendanceAndScheduleScreen.kt 100%)
        function renderAttendanceScreen() {
            const curDept = getCurrentDept();
            const curStage = getCurrentStage();
            const baseStudents = state.globalSec
                ? getStageStudents().filter(s => s.section === state.globalSec)
                : getStageStudents();

            const effectiveStatuses = {};
            let presentCount = 0, absentCount = 0, excusedCount = 0, intisabCount = 0, warningStudentsCount = 0;

            baseStudents.forEach(s => {
                const st = resolveEffectiveAttendanceStatus(s.id, state.attendanceDate, state.attendance, state.studentTags);
                effectiveStatuses[s.id] = st;
                if (st === "present") presentCount++;
                else if (st === "absent") absentCount++;
                else if (st === "excused") excusedCount++;
                else if (st === "intisab") intisabCount++;

                const isInt = isStudentIntisab(s.id, state.studentTags) || st === "intisab";
                if (!isInt && countStudentTotalAbsences(s.id) >= 3) warningStudentsCount++;
            });

            const regTotal = Math.max(0, baseStudents.length - intisabCount);
            const attendanceRate = regTotal === 0 ? 100 : Math.min(100, Math.round(((presentCount + excusedCount) * 100) / regTotal));

            const q = (state.attendanceSearch || "").trim().toLowerCase();
            const displayedStudents = baseStudents.filter(std => {
                if (q && !std.name.toLowerCase().includes(q)) return false;
                const todaySt = effectiveStatuses[std.id] || "present";
                const isInt = isStudentIntisab(std.id, state.studentTags) || todaySt === "intisab";
                const totAbs = isInt ? 0 : countStudentTotalAbsences(std.id);
                if (state.attendanceFilter === "absent") return todaySt === "absent";
                if (state.attendanceFilter === "excused") return todaySt === "excused";
                if (state.attendanceFilter === "intisab") return isInt;
                if (state.attendanceFilter === "warnings") return !isInt && totAbs >= 3;
                return true;
            });

            const last7Days = getLast7DaysList();
            const todayStr = getTodayStr();

            const timelineStripHtml = last7Days.map(dItem => {
                const isSel = state.attendanceDate === dItem.dateStr;
                const dayAbs = baseStudents.filter(s => state.attendance[`${s.id}_${dItem.dateStr}`] === "absent").length;
                return `
                <button onclick="setAttendanceDate('${dItem.dateStr}')" style="min-width:68px;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;background:${isSel ? '#4F46E5' : 'var(--bg-sub)'};border:1px solid ${isSel ? '#818CF8' : 'var(--border-color)'};color:${isSel ? '#FFF' : 'var(--text-primary)'};">
                    <span style="font-size:11px;font-weight:900;">${escapeHtml(dItem.dayNameAr)}</span>
                    <span style="font-size:10px;font-weight:700;opacity:0.85;">${escapeHtml(dItem.shortDate)}</span>
                    ${dayAbs > 0 ? `
                        <span style="border-radius:6px;padding:1px 5px;font-size:9px;font-weight:900;background:${isSel ? 'rgba(255,255,255,0.22)' : 'rgba(244,63,94,0.14)'};color:${isSel ? '#FFF' : '#F43F5E'};">${dayAbs} غياب</span>
                    ` : `
                        <span style="font-size:10px;font-weight:900;color:${isSel ? '#34D399' : '#94A3B8'};">✓</span>
                    `}
                </button>`;
            }).join("");

            // Fast Roll Call Card
            let rollCallHtml = "";
            if (state.isRollCallMode && baseStudents.length > 0) {
                const safeIdx = Math.max(0, Math.min(state.rollCallIndex, baseStudents.length - 1));
                const currentStd = baseStudents[safeIdx];
                const curSt = effectiveStatuses[currentStd.id] || "present";
                const isIntStd = isStudentIntisab(currentStd.id, state.studentTags) || curSt === "intisab";
                const totAbs = isIntStd ? 0 : countStudentTotalAbsences(currentStd.id);
                const pct = Math.round(((safeIdx + 1) / baseStudents.length) * 100);

                rollCallHtml = `
                <div class="card" style="border:2px solid ${isIntStd ? '#8B5CF6' : '#6366F1'};background:${state.darkMode ? '#0F172A' : '#EEF2FF'};display:flex;flex-direction:column;align-items:center;gap:12px;">
                    <div style="width:100%;display:flex;align-items:center;justify-content:space-between;">
                        <button onclick="stepRollCall(-1)" style="width:34px;height:34px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);font-weight:900;" ${safeIdx === 0 ? 'disabled' : ''}>➡️</button>
                        <div style="text-align:center;">
                            <div style="font-size:12px;font-weight:900;color:#4F46E5;">🎙️ المناداة السريعة (${safeIdx + 1} من ${baseStudents.length})</div>
                            <div style="width:140px;height:6px;border-radius:10px;background:rgba(99,102,241,0.22);margin:4px auto 0;overflow:hidden;">
                                <div style="width:${pct}%;height:100%;background:#4F46E5;"></div>
                            </div>
                        </div>
                        <button onclick="stepRollCall(1)" style="width:34px;height:34px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);font-weight:900;" ${safeIdx >= baseStudents.length - 1 ? 'disabled' : ''}>⬅️</button>
                    </div>
                    <div style="text-align:center;">
                        <div style="font-size:18px;font-weight:900;">${escapeHtml(currentStd.name)}</div>
                        <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;flex-wrap:wrap;">
                            <span style="background:rgba(79,70,229,0.14);color:#4F46E5;border-radius:8px;padding:2px 9px;font-size:11px;font-weight:900;">شعبة (${escapeHtml(currentStd.section)})</span>
                            ${isIntStd ? `<span style="background:rgba(139,92,246,0.16);color:#8B5CF6;border-radius:8px;padding:2px 9px;font-size:11px;font-weight:900;">🏠 طالب انتساب (معفي من الدروس — امتحانات فقط)</span>` : (totAbs > 0 ? `<span style="background:rgba(244,63,94,0.14);color:#E11D48;border-radius:8px;padding:2px 9px;font-size:11px;font-weight:900;">إجمالي الغياب: ${totAbs} يوم</span>` : '')}
                        </div>
                    </div>
                    <div style="width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
                        <button onclick="markRollCallStatus('${currentStd.id}','present')" style="height:46px;border-radius:13px;background:#10B981;color:#FFF;font-size:11px;font-weight:900;">${isIntStd ? 'حاضر امتحان ✅' : 'حاضر ✅'}</button>
                        <button onclick="markRollCallStatus('${currentStd.id}','absent')" style="height:46px;border-radius:13px;background:#E11D48;color:#FFF;font-size:11px;font-weight:900;">غائب ❌</button>
                        <button onclick="markRollCallStatus('${currentStd.id}','excused')" style="height:46px;border-radius:13px;background:#F59E0B;color:#FFF;font-size:11px;font-weight:900;">إجازة 🕒</button>
                        <button onclick="markRollCallStatus('${currentStd.id}','intisab')" style="height:46px;border-radius:13px;background:#8B5CF6;color:#FFF;font-size:11px;font-weight:900;">انتساب 🏠</button>
                    </div>
                </div>`;
            }

            const secOpts = `<option value="" ${state.globalSec === "" ? "selected" : ""}>كل الشعب (${(curStage.sections||[]).join("،")})</option>` +
                (curStage.sections || []).map(sec => `<option value="${escapeHtml(sec)}" ${state.globalSec === sec ? "selected" : ""}>شعبة (${escapeHtml(sec)})</option>`).join("");

            const filterTabs = [
                ["all", `الكل (${baseStudents.length})`, "#4F46E5"],
                ["absent", `❌ غائب اليوم (${absentCount})`, "#E11D48"],
                ["excused", `🕒 إجازة (${excusedCount})`, "#F59E0B"],
                ["intisab", `🏠 طلاب الانتساب (${intisabCount})`, "#8B5CF6"],
                ["warnings", `🚨 إنذارات الغياب (${warningStudentsCount})`, "#B91C1C"]
            ].map(([fKey, fLbl, fCol]) => {
                const sel = state.attendanceFilter === fKey;
                return `<button onclick="setAttendanceFilter('${fKey}')" style="border-radius:10px;padding:6px 10px;font-size:11px;font-weight:900;white-space:nowrap;background:${sel ? fCol : 'var(--bg-sub)'};border:1px solid ${sel ? fCol : 'var(--border-color)'};color:${sel ? '#FFF' : 'var(--text-primary)'};">${escapeHtml(fLbl)}</button>`;
            }).join("");

            const studentCardsHtml = displayedStudents.length === 0 ? `
                <div class="card" style="text-align:center;padding:28px 16px;color:var(--text-muted);font-weight:900;">
                    ${state.attendanceFilter === "absent" ? "🎉 لا يوجد أي طالب غائب في هذا اليوم!" :
                      state.attendanceFilter === "intisab" ? "🏠 لا يوجد طلاب انتساب مسجلون في هذه الشعبة حالياً (يمكنك الضغط على زر [انتساب 🏠] أمام أي طالب لتحديده)" :
                      state.attendanceFilter === "warnings" ? "✅ لا يوجد طلاب متجاوزون لحد الإنذار في هذه الشعبة" :
                      "لا يوجد طلاب مطابقون للبحث في هذا النطاق"}
                </div>
            ` : displayedStudents.map((std, idx) => {
                const curStatus = effectiveStatuses[std.id] || "present";
                const isTaggedInt = isStudentIntisab(std.id, state.studentTags);

                            <div style="font-size:14px;font-weight:900;">معلومات المدرسة والمدرس الرسمية</div>
                            <div style="font-size:11px;color:var(--text-muted);">تظهر هذه المعلومات في الترويسة الرسمية وتقارير الطباعة والشهادات</div>
                        </div>
                    </div>
                    <div style="height:1px;background:var(--border-color);"></div>
                    <div>
                        <label style="font-size:11px;font-weight:800;color:var(--text-muted);display:block;margin-bottom:3px;">اسم الوزارة / المديرية</label>
                        <input type="text" class="field-input" value="${escapeHtml(state.settingsFormMinistry)}" oninput="state.settingsFormMinistry=this.value; state.hasUnsavedSettings=true;" />
                    </div>
                    <div>
                        <label style="font-size:11px;font-weight:800;color:var(--text-muted);display:block;margin-bottom:3px;">اسم المدرسة</label>
                        <input type="text" class="field-input" value="${escapeHtml(state.settingsFormSchool)}" oninput="state.settingsFormSchool=this.value; state.hasUnsavedSettings=true;" />
                    </div>
                    <div style="display:grid;grid-template-columns:1.15fr 0.85fr;gap:8px;">
                        <div>
                            <label style="font-size:11px;font-weight:800;color:var(--text-muted);display:block;margin-bottom:3px;">اسم المدرس</label>
                            <input type="text" class="field-input" value="${escapeHtml(state.settingsFormTeacher)}" oninput="state.settingsFormTeacher=this.value; state.hasUnsavedSettings=true;" />
                        </div>
                        <div>
                            <label style="font-size:11px;font-weight:800;color:var(--text-muted);display:block;margin-bottom:3px;">العام الدراسي</label>
                            <input type="text" class="field-input" value="${escapeHtml(state.settingsFormYear)}" oninput="state.settingsFormYear=this.value; state.hasUnsavedSettings=true;" />
                        </div>
                    </div>
                    <button onclick="saveOfficialSchoolSettings()" style="width:100%;height:50px;border-radius:14px;background:${state.hasUnsavedSettings ? '#059669' : '#4F46E5'};color:#FFF;font-size:14px;font-weight:900;">
                        💾 ${state.hasUnsavedSettings ? 'حفظ التعديلات الجديدة الآن ✓' : 'حفظ معلومات المدرسة والمدرس ✓'}
                    </button>
                </div>

                <!-- Card 2: Academic Structure Editor -->
                <div class="card" style="display:flex;flex-direction:column;gap:14px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="width:38px;height:38px;border-radius:11px;background:rgba(99,102,241,0.14);color:#6366F1;display:flex;align-items:center;justify-content:center;font-size:18px;">🎓</div>
                            <div>
                                <div style="font-size:14px;font-weight:900;">الهيكلية الدراسية</div>
                                <div style="font-size:11px;color:var(--text-muted);">المراحل • الصفوف • المواد • الشُعب</div>
                            </div>
                        </div>
                        <button onclick="toggleStructureDeleteMode()" style="border-radius:99px;padding:6px 12px;font-size:11px;font-weight:900;background:${state.isDeleteMode ? 'rgba(225,29,72,0.14)' : 'rgba(5,150,105,0.14)'};border:1px solid ${state.isDeleteMode ? '#E11D48' : '#059669'};color:${state.isDeleteMode ? '#E11D48' : '#059669'};">
                            ${state.isDeleteMode ? '🔓 وضع الحذف مفعّل' : '🔒 حماية التعديل (مُقفل)'}
                        </button>
                    </div>

                    <!-- 1. Departments -->
                    <div style="border-radius:18px;background:var(--bg-sub);border:1px solid var(--border-color);padding:12px;display:flex;flex-direction:column;gap:10px;">
                        <div style="font-size:12px;font-weight:900;color:#6366F1;">1. المراحل الدراسية</div>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="new-dept-inp" class="field-input" style="background:var(--bg-card);" placeholder="اسم المرحلة..." />
                            <button onclick="addStructureDept()" style="width:48px;height:44px;border-radius:12px;background:#4F46E5;color:#FFF;font-size:20px;font-weight:900;flex-shrink:0;">+</button>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${deptsChips}</div>
                    </div>

                    <!-- 2. Stages -->
                    <div style="border-radius:18px;background:var(--bg-sub);border:1px solid var(--border-color);padding:12px;display:flex;flex-direction:column;gap:10px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                            <span style="font-size:12px;font-weight:900;color:#F59E0B;">2. صفوف (${escapeHtml(curDept.name)})</span>
                            <button onclick="toggleCurrentStageMaxGrade()" style="border-radius:9px;background:var(--bg-card);border:1px solid #F59E0B;color:#D97706;padding:4px 9px;font-size:10px;font-weight:900;">
                                نظام لـ (${escapeHtml(curStage.name)}): من ${maxG} 🔄
                            </button>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="new-stage-inp" class="field-input" style="background:var(--bg-card);" placeholder="اسم الصف..." />
                            <button onclick="addStructureStage()" style="width:48px;height:44px;border-radius:12px;background:#F59E0B;color:#FFF;font-size:20px;font-weight:900;flex-shrink:0;">+</button>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${stagesChips}</div>
                    </div>

                    <!-- 3. Subjects -->
                    <div style="border-radius:18px;background:var(--bg-sub);border:1px solid var(--border-color);padding:12px;display:flex;flex-direction:column;gap:10px;">
                        <div style="font-size:12px;font-weight:900;color:#10B981;">3. مواد (${escapeHtml(curStage.name)})</div>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="new-sub-inp" class="field-input" style="background:var(--bg-card);" placeholder="اسم المادة..." />
                            <button onclick="addStructureSub()" style="width:48px;height:44px;border-radius:12px;background:#10B981;color:#FFF;font-size:20px;font-weight:900;flex-shrink:0;">+</button>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${subsChips}</div>
                    </div>

                    <!-- 4. Sections -->
                    <div style="border-radius:18px;background:var(--bg-sub);border:1px solid var(--border-color);padding:12px;display:flex;flex-direction:column;gap:10px;">
                        <div style="font-size:12px;font-weight:900;color:#9333EA;">4. شُعب (${escapeHtml(curStage.name)})</div>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="new-sec-inp" class="field-input" style="background:var(--bg-card);" placeholder="اسم الشعبة (مثل: د، هـ)..." />
                            <button onclick="addStructureSec()" style="width:48px;height:44px;border-radius:12px;background:#9333EA;color:#FFF;font-size:20px;font-weight:900;flex-shrink:0;">+</button>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${secsChips}</div>
                    </div>
                </div>
            </div>`;
        }
        // ============================================================
        // PART 6: SPEED GRADING SCREEN & OFFICIAL PRINT STUDIO OVERLAYS
        // ============================================================
        function getSpeedStudentsList() {
            const list = state.globalSec
                ? getStageStudents().filter(s => s.section === state.globalSec)
                : getStageStudents();
            return [...list].sort((a, b) => a.name.localeCompare(b.name, "ar"));
        }

        function renderSpeedGradingOverlay() {
            if (!state.isSpeedModeOpen) return "";
            const speedList = getSpeedStudentsList();
            const activeSub = state.globalSub || (getCurrentStage().subjects[0] || "عام");
            const maxG = getMaxAllowedGrade();
            const failThr = getFailThreshold();
            const cfg = state.speedConfig;
            const activeIdx = speedList.length ? Math.max(0, Math.min(cfg.activeIdx, speedList.length - 1)) : 0;
            const currentStudent = speedList[activeIdx] || null;
            const activeTab = cfg.activeTab || "m1";
            const isMonthlyTab = activeTab.startsWith("m") && activeTab !== "mid" && maxG !== 10;
            const activeSubFieldIdx = isMonthlyTab ? Math.max(0, Math.min(cfg.activeSubFieldIdx, 2)) : 0;

            const skyAccent = state.darkMode ? "#38BDF8" : "#0284C7";
            const violetAccent = state.darkMode ? "#A78BFA" : "#7C3AED";
            const amberAccent = state.darkMode ? "#FBBF24" : "#F59E0B";
            const subFieldAccents = [skyAccent, violetAccent, amberAccent];
            const activeFieldAccent = isMonthlyTab ? subFieldAccents[activeSubFieldIdx] : amberAccent;

            if (!currentStudent) {
                return `
                <div class="fullscreen-overlay">
                    <div class="app-shell" style="padding:12px;display:flex;flex-direction:column;gap:12px;height:100%;">
                        <div class="card" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;">
                            <div style="font-size:44px;">👥</div>
                            <div style="font-size:15px;font-weight:900;color:var(--text-muted);">لا يوجد طلاب في هذه الشعبة.</div>
                            <button onclick="closeSpeedGradingMode()" style="border-radius:14px;background:#0F172A;color:#FFF;padding:12px 24px;font-size:13px;font-weight:900;">العودة للوحة التحكم</button>
                        </div>
                    </div>
                </div>`;
            }

            const gKey = `${currentStudent.id}_${activeSub}`;
            const stdGrades = state.grades[gKey] || {};
            const calcRes = calculateResults(stdGrades, maxG);
            const mIdx = parseInt(activeTab.replace("m", ""), 10) || 1;
            const startFieldNum = (mIdx - 1) * 3 + 1;
            const v1Str = (stdGrades[`v${startFieldNum}`] || "").toString();
            const v2Str = (stdGrades[`v${startFieldNum + 1}`] || "").toString();
            const v3Str = (stdGrades[`v${startFieldNum + 2}`] || "").toString();
            const hasAnyInActiveMonth = !!(v1Str || v2Str || v3Str);
            const liveMonthSum = (parseInt(v1Str, 10) || 0) + (parseInt(v2Str, 10) || 0) + (parseInt(v3Str, 10) || 0);
            const displayTabTotal = isMonthlyTab ? liveMonthSum : (parseInt(stdGrades[activeTab] || "0", 10) || 0);
            const isPassingTab = displayTabTotal >= failThr;

            const tabsList = [
                ["m1", "ف1 - شهر 1"],
                ["m2", "ف1 - شهر 2"],
                ["mid", "نصف السنة"],
                ["m3", "ف2 - شهر 1"],
                ["m4", "ف2 - شهر 2"],
                ["final", "النهائي"],
                ["secondRound", "الدور الثاني"]
            ];
            const tabsHtml = tabsList.map(([tId, lbl]) => {
                const sel = activeTab === tId;
                return `<button onclick="updateSpeedConfig(null, '${tId}', 0)" style="border-radius:10px;padding:7px 12px;font-size:12px;font-weight:900;white-space:nowrap;background:${sel ? '#4F46E5' : 'var(--bg-card)'};border:1.5px solid ${sel ? '#818CF8' : 'var(--border-color)'};color:${sel ? '#FFF' : 'var(--text-secondary)'};">${lbl}</button>`;
            }).join("");

            let fieldsSectionHtml = "";
            if (isMonthlyTab) {
                const subFields = [
                    [0, "يومي", skyAccent],
                    [1, "عملي", violetAccent],
                    [2, "تحريري", amberAccent]
                ];
                const boxesHtml = subFields.map(([i, fLabel, fAccent]) => {
                    const fName = `v${startFieldNum + i}`;
                    const curVal = (stdGrades[fName] || "").toString();
                    const isTarget = activeSubFieldIdx === i;
                    return `
                    <div onclick="updateSpeedConfig(null, null, ${i})" style="border-radius:14px;background:${isTarget ? `${fAccent}18` : 'var(--bg-sub)'};border:${isTarget ? `2.2px solid ${fAccent}` : '1.4px solid var(--border-color)'};padding:8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
                            <span style="width:18px;height:18px;border-radius:50%;background:${isTarget ? fAccent : 'var(--border-color)'};color:#FFF;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;">${i + 1}</span>
                            <span style="font-size:12px;font-weight:900;color:${isTarget ? fAccent : 'var(--text-secondary)'};">${fLabel}</span>
                            <span style="width:14px;"></span>
                        </div>
                        <div style="width:100%;height:1px;background:${isTarget ? fAccent : 'var(--border-color)'};opacity:0.4;"></div>
                        <div style="font-size:22px;font-weight:900;color:${curVal ? 'var(--text-primary)' : 'var(--text-muted)'};">${escapeHtml(curVal || "-")}</div>
                    </div>`;
                }).join("");

                const totCol = isPassingTab ? "#10B981" : "#F43F5E";
                fieldsSectionHtml = `
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;">
                        ${boxesHtml}
                    </div>
                    <div style="width:100%;border-radius:12px;background:${totCol}1A;border:1.8px solid ${totCol};padding:7px 12px;display:flex;align-items:center;justify-content:space-between;">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span style="font-size:13px;font-weight:900;">مجموع الشهر:</span>
                            <button onclick="toggleSpeedAutoAdvance()" style="border-radius:8px;padding:3px 8px;font-size:10px;font-weight:800;background:${cfg.autoAdvance ? 'rgba(99,102,241,0.15)' : 'rgba(148,163,184,0.15)'};border:1px solid ${cfg.autoAdvance ? '#6366F1' : '#94A3B8'};color:${cfg.autoAdvance ? '#6366F1' : '#94A3B8'};">
                                ${cfg.autoAdvance ? 'انتقال تلقائي: مفعل ✓' : 'انتقال تلقائي: متوقف'}
                            </button>
                        </div>
                        <span style="border-radius:9px;background:var(--bg-card);border:1.5px solid ${totCol};padding:3px 14px;font-size:17px;font-weight:900;color:${totCol};">
                            ${hasAnyInActiveMonth ? liveMonthSum : 0} / ${maxG}
                        </span>
                    </div>
                `;
            } else {
                const examField = activeTab.startsWith("m") ? `v${startFieldNum}` : activeTab;
                const examTitle = activeTab === "mid" ? "درجة امتحان نصف السنة" :
                    (activeTab === "final" ? "درجة الامتحان النهائي" :
                    (activeTab === "secondRound" ? "درجة امتحان الدور الثاني" : `درجة الشهر (${maxG})`));
                const curExamVal = (stdGrades[examField] || "").toString();
                const totCol = isPassingTab ? "#10B981" : "#F43F5E";

                fieldsSectionHtml = `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;">
                        <div style="border-radius:14px;background:var(--bg-sub);border:2px solid #F59E0B;padding:10px;text-align:center;">
                            <div style="font-size:12px;font-weight:900;color:#F59E0B;">${examTitle}</div>
                            <div style="height:1px;background:rgba(245,158,11,0.3);margin:4px 0;"></div>
                            <div style="font-size:24px;font-weight:900;">${escapeHtml(curExamVal || "-")}</div>
                        </div>
                        <div style="border-radius:14px;background:var(--bg-sub);border:2px solid ${totCol};padding:10px;text-align:center;">
                            <div style="font-size:12px;font-weight:900;color:${totCol};">النتيجة النهائية</div>
                            <div style="height:1px;background:${totCol}44;margin:4px 0;"></div>
                            <div style="font-size:24px;font-weight:900;color:${totCol};">${calcRes.finalResult} / ${maxG}</div>
                        </div>
                    </div>
                `;
            }

            const isLastFieldInStudent = !isMonthlyTab || activeSubFieldIdx === 2;
            const nextStepLabel = isMonthlyTab
                ? (activeSubFieldIdx === 0 ? "تثبيت اليومي ⬅️ الانتقال للعملي" :
                   (activeSubFieldIdx === 1 ? "تثبيت العملي ⬅️ الانتقال للتحريري" : "تثبيت التحريري ⬅️ الطالب التالي ✅"))
                : "تثبيت الدرجة ⬅️ الطالب التالي ✅";

            const digitBtn = (d) => `
                <button onclick="handleSpeedKeypadDigit('${d}')" style="height:46px;border-radius:10px;background:var(--bg-sub);border:1.5px solid var(--border-color);color:var(--text-primary);font-size:20px;font-weight:900;">
                    ${d}
                </button>`;

            return `
            <div class="fullscreen-overlay">
                <div class="app-shell" style="padding:8px 12px;display:flex;flex-direction:column;gap:8px;min-height:100%;">
                    <!-- 1. Clean Top Bar -->
                    <div class="card" style="border-radius:14px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;">
                        <button onclick="closeSpeedGradingMode()" style="border-radius:10px;background:var(--bg-sub);border:1px solid var(--border-color);color:var(--text-primary);padding:6px 12px;font-size:12px;font-weight:900;">
                            ➡️ رجوع
                        </button>
                        <span style="font-size:15px;font-weight:900;">${escapeHtml(activeSub)}</span>
                        <span style="border-radius:10px;background:rgba(79,70,229,0.14);border:1px solid #6366F1;color:var(--indigo-500);padding:5px 10px;font-size:12px;font-weight:900;">
                            الطالب ${activeIdx + 1} من ${speedList.length}
                        </span>
                    </div>

                    <!-- 2. Student Identity Card + 4-Column Summary Table -->
                    <div class="card" style="border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                            <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                                <div style="width:36px;height:36px;border-radius:10px;background:#4F46E5;color:#FFF;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                    ${activeIdx + 1}
                                </div>
                                <div style="min-width:0;flex:1;">
                                    <div style="font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(currentStudent.name)}</div>
                                    <div style="font-size:11px;font-weight:800;color:#6366F1;">شعبة (${escapeHtml(currentStudent.section)})</div>
                                </div>
                            </div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <button onclick="openBonusModal('${currentStudent.id}')" style="width:36px;height:36px;border-radius:10px;background:rgba(245,158,11,0.15);border:1.2px solid #F59E0B;color:#F59E0B;font-size:16px;">⭐</button>
                                <button onclick="openVoiceGradingPrompt()" style="border-radius:10px;background:#4F46E5;border:1.2px solid #818CF8;color:#FFF;padding:7px 10px;font-size:11px;font-weight:900;">🎙️ رصد صوتي</button>
                            </div>
                        </div>

                        <div style="border-radius:10px;background:var(--bg-sub);border:1.2px solid var(--border-color);display:grid;grid-template-columns:1fr 1fr 1fr 1.1fr;text-align:center;">
                            <div style="padding:5px 2px;border-left:1px solid var(--border-color);">
                                <div style="font-size:10px;font-weight:800;color:var(--text-muted);">معدل ف1</div>
                                <div style="font-size:14px;font-weight:900;color:${skyAccent};">${calcRes.hasAvg1 ? calcRes.avg1 : '-'}</div>
                            </div>
                            <div style="padding:5px 2px;border-left:1px solid var(--border-color);">
                                <div style="font-size:10px;font-weight:800;color:var(--text-muted);">نصف السنة</div>
                                <div style="font-size:14px;font-weight:900;color:${amberAccent};">${calcRes.hasMid ? calcRes.mid : '-'}</div>
                            </div>
                            <div style="padding:5px 2px;border-left:1px solid var(--border-color);">
                                <div style="font-size:10px;font-weight:800;color:var(--text-muted);">معدل ف2</div>
                                <div style="font-size:14px;font-weight:900;color:${violetAccent};">${calcRes.hasAvg2 ? calcRes.avg2 : '-'}</div>
                            </div>
                            <div style="padding:5px 2px;">
                                <div style="font-size:10px;font-weight:800;color:var(--text-muted);">السعي السنوي</div>
                                <div style="font-size:14px;font-weight:900;color:${!calcRes.hasSaei ? '#94A3B8' : (calcRes.saei >= failThr ? '#10B981' : '#F43F5E')};">${calcRes.hasSaei ? calcRes.saei : '-'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Semester & Month Tabs -->
                    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">
                        ${tabsHtml}
                    </div>

                    <!-- 4. Grade Fields + BuiltInSpeedKeypad -->
                    <div class="card" style="border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;">
                        ${fieldsSectionHtml}

                        <!-- Numeric Keypad -->
                        <div style="display:flex;flex-direction:column;gap:6px;margin-top:2px;">
                            <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1.05fr;gap:6px;">
                                ${digitBtn(1)}${digitBtn(2)}${digitBtn(3)}
                                <button onclick="handleSpeedBackspace()" style="height:46px;border-radius:10px;background:rgba(245,158,11,0.14);border:1.5px solid #F59E0B;color:#F59E0B;font-size:13px;font-weight:900;">⌫ حذف</button>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1.05fr;gap:6px;">
                                ${digitBtn(4)}${digitBtn(5)}${digitBtn(6)}
                                <button onclick="handleSpeedClearField()" style="height:46px;border-radius:10px;background:rgba(244,63,94,0.14);border:1.5px solid #F43F5E;color:#F43F5E;font-size:13px;font-weight:900;">مسح</button>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1.05fr;gap:6px;">
                                ${digitBtn(7)}${digitBtn(8)}${digitBtn(9)}
                                <button onclick="handleSpeedKeypadDigit('0')" style="height:46px;border-radius:10px;background:var(--bg-sub);border:1.5px solid ${activeFieldAccent};color:${activeFieldAccent};font-size:20px;font-weight:900;">0</button>
                            </div>
                            <div style="display:flex;gap:6px;">
                                ${maxG === 10 ? `
                                    <button onclick="handleSpeedQuickTen()" style="flex:1;height:46px;border-radius:10px;background:rgba(16,185,129,0.16);border:1.5px solid #10B981;color:#10B981;font-size:13px;font-weight:900;">10 كاملة</button>
                                ` : ''}
                                <button onclick="advanceSpeedField()" style="flex:2.15;height:46px;border-radius:12px;background:${isLastFieldInStudent ? '#10B981' : activeFieldAccent};color:#FFF;font-size:13px;font-weight:900;">
                                    ${nextStepLabel}
                                </button>

                    </div>

                    <!-- 5. Previous / Next Student Navigation Buttons -->
                    <div style="display:grid;grid-template-columns:1fr 1.8fr;gap:8px;">
                        <button onclick="updateSpeedConfig(${Math.max(0, activeIdx - 1)}, null, 0)" style="height:46px;border-radius:12px;background:var(--bg-card);border:1.5px solid var(--border-color);color:var(--text-primary);font-size:13px;font-weight:900;">
                            ➡️ طالب سابق
                        </button>
                        <button onclick="${activeIdx < speedList.length - 1 ? `updateSpeedConfig(${activeIdx + 1}, null, 0)` : 'finishSpeedGrading()'}" style="height:46px;border-radius:12px;background:#4F46E5;color:#FFF;font-size:14px;font-weight:900;">
                            ${activeIdx < speedList.length - 1 ? `الطالب التالي (${activeIdx + 2}/${speedList.length}) ⬅️` : 'إنهاء الرصد ✅'}
